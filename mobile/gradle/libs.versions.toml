#  The version catalog. Resolved from each artifact's own maven-metadata on the
#  day this landed — AGP from Google's maven (it is NOT on Central; the Central
#  copy stops at 2.3.0, which is a 2017 artifact and a trap), everything else
#  from Central. Stable channels only: no alpha, beta, rc or EAP.
#
#  compileSdk/targetSdk live in composeApp/build.gradle.kts rather than here,
#  because they are not dependency versions — they are the platform the
#  provisioner installed (mobile/tools/devbox-install.sh prints what it chose).

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-multiplatform = "1.12.1"
# material3 is NOT on the toolkit's version line — it tracks androidx's own
# material3 numbering and lags the toolkit by several minors. Asking for
# material3:1.12.1 resolves nothing at all.
compose-material3 = "1.9.0"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
androidx-activity-compose = "1.13.0"

[libraries]
# Compose Multiplatform, by explicit coordinate. CMP 1.12 deprecates the
# `compose.runtime` / `compose.material3` DSL accessors ("Specify dependency
# directly"), so the catalog carries them like any other dependency.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }

# The wire. Ktor is why this app is Kotlin: three SSE streams are its backbone
# (docs/MOBILE.md), and Ktor streams natively on OkHttp and NSURLSession both.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 refuses `com.android.application` on a KMP module; THIS is the plugin a
# multiplatform module uses for its android target (see settings.gradle.kts).
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# The Compose COMPILER moved into the Kotlin distribution at 2.0, so it tracks
# `kotlin`; the Compose Multiplatform plugin (toolkit + resources + packaging)
# is JetBrains' own and versions independently.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
