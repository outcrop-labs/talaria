# Gradle + Kotlin daemons are long-lived; a mobile build on a dev box shares the
# machine with a dev stack, five sidecars and whatever else is running, so the
# heap is stated rather than left to a default that assumes the machine is ours.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX is the only support library; the flag is still required to be stated.
android.useAndroidX=true

# Kotlin/Native: Apple targets CANNOT be compiled from Linux (no Xcode, no
# linker), so a Linux box builds and tests Android + common only. The iOS leg is
# CI's job on macos-latest — docs/MOBILE.md, "The stack".
kotlin.native.ignoreDisabledTargets=true
