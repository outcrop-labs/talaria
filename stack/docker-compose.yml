# Talaria docker stack — the bridge (gateway plane) + optional containerized app.
#
# Standalone compose (like ai/orchestration, ai/inference). It joins the shared
# external `edge` network created by the root packledger-services compose, so:
#   • the bridge can reach the LIVE fleet by service name
#     (agent gateways on :8642) — those services attach edge too.
#
# Bring up:  docker compose -f talaria/stack/docker-compose.yml --env-file talaria/stack/.env up -d
# Validate:  docker compose -f talaria/stack/docker-compose.yml config
name: talaria

services:
  # ── The gateway plane: one endpoint multiplexing every agent's gateway ──
  talaria-bridge:
    build:
      context: ../bridge
    image: packledger/talaria-bridge:0.1.0
    restart: unless-stopped
    environment:
      TALARIA_PORT: "9119"
      # M1: log conductor probe/dispatch requests (set 1 to capture the capability probe).
      TALARIA_LOG_REQUESTS: ${TALARIA_LOG_REQUESTS:-0}
      TALARIA_GATEWAY_PORT: "8642"
      TALARIA_FLEET_FILE: /run/talaria/fleet.json # the fleet manifest (agent → gateway + key)
      TALARIA_DEFAULT_MODEL: ${TALARIA_DEFAULT_MODEL:-dex-developer}
    volumes:
      - ./fleet.json:/run/talaria/fleet.json:ro # gitignored; agents + per-agent keys
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9119/__talaria/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # edge → tunnel/live dashboard; ai_default → reach the agent gateways by name.
    networks: [default, edge, ai_default]
    ports:
      - "127.0.0.1:9119:9119" # dashboard plane (local debug)
      - "127.0.0.1:8642:8642" # gateway plane / fleet multiplexer (local debug)

  talaria-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talaria
      POSTGRES_DB: talaria
      POSTGRES_PASSWORD: ${TALARIA_DB_PASSWORD:?set TALARIA_DB_PASSWORD in stack/.env}
    volumes:
      - talaria-postgres-data:/var/lib/postgresql/data
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaria -d talaria"]
      interval: 10s
      timeout: 5s
      retries: 5

  talaria-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - talaria-redis-data:/data
    networks: [default]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  talaria-ui:
    build:
      context: ../ui
    image: packledger/talaria-ui:0.1.0
    restart: unless-stopped
    depends_on:
      talaria-postgres:
        condition: service_healthy
      talaria-redis:
        condition: service_healthy
      talaria-bridge:
        condition: service_started
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      NODE_ENV: production
      # State
      DATABASE_URL: postgres://talaria:${TALARIA_DB_PASSWORD}@talaria-postgres:5432/talaria
      REDIS_URL: redis://talaria-redis:6379
      TALARIA_GATEWAY_URL: ${TALARIA_GATEWAY_URL:-http://talaria-bridge:8642}
      # Agents present this to register/heartbeat to Talaria's own brain.
      TALARIA_AGENT_KEY: ${TALARIA_AGENT_KEY:-}
      # Auth (see stack/.env.example). Behind the CF/HTTPS tunnel COOKIE_SECURE=true.
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_ALLOWED_DOMAINS: ${AUTH_ALLOWED_DOMAINS:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-0}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_HD: ${AUTH_GOOGLE_HD:-}
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-0}
      AUTH_USERS: ${AUTH_USERS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    networks: [default, edge]
    ports:
      - "127.0.0.1:5273:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/auth/providers').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
  # Created by the root packledger-services compose; the tunnel + live fleet live here.
  edge:
    external: true
    name: packledger-services_edge
  # The ai/orchestration fleet network — lets the gateway plane reach agent-* gateways by name.
  ai_default:
    external: true
    name: ai_default

volumes:
  talaria-postgres-data:
  talaria-redis-data:
