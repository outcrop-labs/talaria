# The fleet chassis — every agent renders from this one service block.
# Talaria stamps per-agent identity (key, model name, config/SOUL/skills
# mounts, state volume) at render time; put only SHARED anatomy here.
#
# The fleet's brain is Talaria's own gateway: LLM_BASE_URL/API_KEY/MODEL are
# provisioned into fleet/.env by Talaria (config plane is Talaria-owned), so
# every agent call is guarded, metered, and observable. Configure the real
# upstream model in-app on /models — no hand-editing here. HERMES_IMAGE
# overrides the agent image.
service:
  image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
  command: gateway run
  restart: unless-stopped
  # ── Sandbox limits ─────────────────────────────────────────────────────────
  # An agent with a workbench profile executes model-authored code, so treat the
  # container as hostile-by-default rather than as trusted infrastructure.
  #
  # If a future harness genuinely needs a capability, add it back explicitly
  # with cap_add rather than widening this.
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL
  # The five below are what s6-overlay needs to boot at all — dropping ALL with
  # no cap_add crash-loops every agent. The image starts as root and drops to
  # the hermes uid itself (see the `user:` note below); taking the capabilities
  # away takes away its ability to do the dropping. What fails, in order:
  # s6-setuidgid's setgroups() dies "Operation not permitted", both cont-init
  # hooks exit 111, so the /opt/data bootstrap never runs, so /opt/data stays
  # hermes-owned 0700 and root can't even cd into it. KILL is not about boot —
  # without it s6 can't signal its hermes-uid children, so `docker stop` falls
  # through to SIGKILL and every fleetStop/fleetRestart/roll hard-kills the
  # agent at the timeout instead of shutting it down. Verified minimal: FOWNER
  # and the rest are genuinely not needed.
  cap_add:
    - CHOWN # stage2 chowns the /opt/data state volume
    - DAC_OVERRIDE # root must traverse hermes-owned 0700 /opt/data
    - SETUID # s6-setuidgid drops the supervision tree to hermes
    - SETGID # setgroups() — the syscall that fails first without this
    - KILL # s6 signals hermes-uid children; graceful stop
  # Resource ceilings. Without pids_limit, one runaway build or fork bomb inside
  # a single agent takes down the host — and with it the database, the app, and
  # every other agent. Tune per deployment; these are headroom for a coding
  # harness, not a tight budget.
  pids_limit: ${AGENT_PIDS_LIMIT:-512}
  mem_limit: ${AGENT_MEM_LIMIT:-4g}
  cpus: ${AGENT_CPUS:-2}
  # NOT set, deliberately: `user:`. s6-overlay expects to start as root and drop
  # privileges itself (fix-attrs chowns the state volume on boot), so pinning a
  # uid breaks init AND orphans the existing /opt/data volumes of every deployed
  # agent. Rootless agents need an image built for it, not a compose override.
  #
  # The app runs on the host in dev; this lets agents reach Talaria's gateway at
  # host.docker.internal on any docker network (subnet-independent). NOTE this is
  # also the agent's route to anything else listening on the host — keep host
  # services bound to loopback-only (docker/dev-compose.yml does). In a fully
  # containerized stack, drop this and set TALARIA_GATEWAY_SELF_URL to the app's
  # service DNS instead.
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  # ── External DNS ───────────────────────────────────────────────────────────
  # Agents need real internet name resolution: the browser toolset fetches its
  # agent-browser engine from npm on first use, and the web tools resolve
  # remote hosts. Docker's default upstream is whatever the HOST's
  # /etc/resolv.conf pointed at when the network was created, which breaks
  # silently in two common ways: a loopback stub resolver on the host (docker
  # rewires containers to the bridge IP, where nothing listens) and a LAN/router
  # resolver that refuses queries arriving from docker subnets. Either way the
  # fleet comes up green and every external name dies with EAI_AGAIN/SERVFAIL —
  # exactly how the built-in browser shipped dead while agents looked healthy.
  # Explicit resolvers per service sidestep the host's resolver entirely; the
  # embedded 127.0.0.11 resolver forwards to these. Override AGENT_DNS_1/_2 in
  # fleet/.env where public resolvers are blocked (e.g. a corporate forwarder).
  dns:
    - ${AGENT_DNS_1:-1.1.1.1}
    - ${AGENT_DNS_2:-1.0.0.1}
  healthcheck:
    test: ['CMD-SHELL', 'curl -sf http://localhost:8642/health || exit 1']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s
  environment:
    # Talaria's org gateway (provisioned into fleet/.env). The default keeps the
    # fleet pointed at the gateway even before the first render writes the .env.
    LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:5273/api/llm/v1}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    API_SERVER_ENABLED: 'true'
    API_SERVER_HOST: 0.0.0.0
    HERMES_ACCEPT_HOOKS: '1'
    HERMES_SKIP_CONFIG_MIGRATION: '1'
    TALARIA_HEARTBEAT_SECONDS: ${TALARIA_HEARTBEAT_SECONDS:-0}
  volumes: []

# Fresh installs get their own fleet network (created by `talaria setup`).
network:
  name: talaria
