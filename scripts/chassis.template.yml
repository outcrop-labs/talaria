# The fleet chassis — every agent renders from this one service block.
# Talaria stamps per-agent identity (key, model name, config/SOUL/skills
# mounts, state volume) at render time; put only SHARED anatomy here.
#
# The fleet's brain is Talaria's own gateway: LLM_BASE_URL/API_KEY are
# provisioned into fleet/.env by Talaria (config plane is Talaria-owned), so
# every agent call is guarded, metered, and observable. Configure the real
# upstream model in-app on /models — no hand-editing here.
#
# THE IMAGE IS PINNED, tag AND digest, so every host runs the Hermes this
# render was checked against — never whatever `:latest` a host cached first.
# A host pulls a pin it lacks on the next roll or start (on an image install
# the post-deploy fleet roll moves running agents onto it; elsewhere, Roll
# all). HERMES_IMAGE in fleet/.env overrides it. This line is copied into
# fleet/chassis.yml once and never rewritten, so the render reads any stock
# default it ever shipped as "not chosen" and renders the current pin
# (HERMES_IMAGE_DEFAULTS, talaria-fleet-render). Bumping it:
# docs/ARCHITECTURE.md, "The fleet" — the same string is the last entry of
# HERMES_IMAGE_DEFAULTS and the workbench image's FROM, and tests fail if
# they disagree.
service:
  image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.22.4@sha256:7a69201726bc64db2072a1371557137c23312d29705cda2b8ea2a0214a50a4cf}
  command: gateway run
  restart: unless-stopped
  # A roll recreates the container in place, so this is the outer bound on a
  # stop: docker SIGKILLs past it. Hermes holds cron and /v1 runs open for up
  # to agent.cron_drain_timeout (30s) plus a 10s cleanup reserve on SIGTERM,
  # and docker's default 10s would cut them off. The drain itself does not
  # come from docker's SIGTERM — s6-overlay would revive the gateway and KILL
  # it 3s later — so Talaria first stops the gateway through s6 inside the
  # container (talaria-fleet-docker, drain_gateway) and lets it finish. The
  # render applies this default to a chassis that predates this line.
  stop_grace_period: 45s
  # ── Sandbox limits ─────────────────────────────────────────────────────────
  # An agent with a workbench profile executes model-authored code, so treat the
  # container as hostile-by-default rather than as trusted infrastructure.
  #
  # If a future harness genuinely needs a capability, add it back explicitly
  # with cap_add rather than widening this.
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL
  # The five below are what s6-overlay needs to boot at all — dropping ALL with
  # no cap_add crash-loops every agent. The image starts as root and drops to
  # the hermes uid itself (see the `user:` note below); taking the capabilities
  # away takes away its ability to do the dropping. What fails, in order:
  # s6-setuidgid's setgroups() dies "Operation not permitted", both cont-init
  # hooks exit 111, so the /opt/data bootstrap never runs, so /opt/data stays
  # hermes-owned 0700 and root can't even cd into it. KILL is not about boot —
  # without it s6 can't signal its hermes-uid children, so `docker stop` falls
  # through to SIGKILL and every fleetStop/fleetRestart/roll hard-kills the
  # agent at the timeout instead of shutting it down. Verified minimal: FOWNER
  # and the rest are genuinely not needed.
  cap_add:
    - CHOWN # stage2 chowns the /opt/data state volume
    - DAC_OVERRIDE # root must traverse hermes-owned 0700 /opt/data
    - SETUID # s6-setuidgid drops the supervision tree to hermes
    - SETGID # setgroups() — the syscall that fails first without this
    - KILL # s6 signals hermes-uid children; graceful stop
  # Resource ceilings. pids_limit is the fork-bomb wall. mem_limit is LAST-
  # DITCH (a leak must not eat the VM). No hard `cpus:` quota — that failed
  # chassis smoke on 4-CPU runners (`range of CPUs is from 0.01 to 4.00`)
  # and throttled idle cores on bigger boxes. cpu_shares is relative fairness.
  pids_limit: ${AGENT_PIDS_LIMIT:-1024}
  mem_reservation: ${AGENT_MEM_RESERVATION:-768m}
  mem_limit: ${AGENT_MEM_LIMIT:-2g}
  cpu_shares: ${AGENT_CPU_SHARES:-1024}
  oom_score_adj: 500
  # NOT set, deliberately: `user:`. s6-overlay expects to start as root and drop
  # privileges itself (fix-attrs chowns the state volume on boot), so pinning a
  # uid breaks init AND orphans the existing /opt/data volumes of every deployed
  # agent. Rootless agents need an image built for it, not a compose override.
  #
  # The app runs on the host in dev; this lets agents reach Talaria's gateway at
  # host.docker.internal on any docker network (subnet-independent). NOTE this is
  # also the agent's route to anything else listening on the host — keep host
  # services bound to loopback-only (docker/dev-compose.yml does). In a fully
  # containerized stack, drop this and set TALARIA_GATEWAY_SELF_URL to the app's
  # service DNS instead.
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  # ── External DNS ───────────────────────────────────────────────────────────
  # Agents need real internet name resolution: the browser toolset's
  # agent-browser engine is installed from npm before an agent with the
  # browser and the terminal on starts (in a one-shot run of this same
  # service, so with these resolvers), and the web tools resolve remote hosts. Docker's default upstream is whatever the HOST's
  # /etc/resolv.conf pointed at when the network was created, which breaks
  # silently in two common ways: a loopback stub resolver on the host (docker
  # rewires containers to the bridge IP, where nothing listens) and a LAN/router
  # resolver that refuses queries arriving from docker subnets. Either way the
  # fleet comes up green and every external name dies with EAI_AGAIN/SERVFAIL —
  # exactly how the built-in browser shipped dead while agents looked healthy.
  # Explicit resolvers per service sidestep the host's resolver entirely; the
  # embedded 127.0.0.11 resolver forwards to these. Override AGENT_DNS_1/_2 in
  # fleet/.env where public resolvers are blocked (e.g. a corporate forwarder).
  dns:
    - ${AGENT_DNS_1:-1.1.1.1}
    - ${AGENT_DNS_2:-1.0.0.1}
  healthcheck:
    test: ['CMD-SHELL', 'curl -sf http://localhost:8642/health || exit 1']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s
  environment:
    # Talaria's org gateway (provisioned into fleet/.env). The default keeps the
    # fleet pointed at the gateway even before the first render writes the .env.
    #
    # WHAT A CONTAINER'S ENVIRONMENT EXPOSES, and why each line is still here.
    # Every service gets: LLM_API_KEY — the line below is the chassis's
    # fallback only; the render overrides it per service with THAT agent's
    # own gateway key (`${LLM_API_KEY_<SLUG>}`, fleet-brain), because every
    # model spec in the rendered config.yaml reads `${LLM_API_KEY}` and Hermes
    # resolves it from the env. The fleet-wide key reaches no container on a
    # managed brain; only an operator's raw-upstream override (LLM_BASE_URL
    # pointed off the gateway) leaves this fallback in force. API_SERVER_KEY —
    # this agent's own Hermes API bearer, the one Talaria dials it with.
    # TALARIA_AGENT_KEY — this agent's own `tak_` credential, by design. A
    # Developer Agent ALSO gets LLM_WORKBENCH_API_KEY as
    # TALARIA_WORKBENCH_API_KEY (the sandbox harness's key — workbench-harnesses;
    # not OPENAI_API_KEY, which Hermes strips from every command the agent
    # runs) and, with a coding account, OMP_AUTH_BROKER_TOKEN (= its own agent
    # key). No other service carries the workbench key. Of these, Hermes
    # strips only API_SERVER_KEY from the agent's terminal; the rest reach it.
    # The closed toolset default (no terminal, file, code
    # execution or self-scheduling on a new agent — talaria-agent-defs
    # DEFAULT_DISABLED_FOR_NEW) is what keeps this environment out of a
    # prompt-injected `env | curl`; an agent whose manager opens a shell is an
    # agent whose manager accepted that its env is readable from it.
    LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:5273/api/llm/v1}
    LLM_API_KEY: ${LLM_API_KEY:-}
    API_SERVER_ENABLED: 'true'
    API_SERVER_HOST: 0.0.0.0
    HERMES_ACCEPT_HOOKS: '1'
    HERMES_SKIP_CONFIG_MIGRATION: '1'
  volumes: []

# Fresh installs get their own fleet network (created by `talaria setup`).
network:
  name: talaria
