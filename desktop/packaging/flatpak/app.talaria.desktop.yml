# The flatpak — built by build.sh, which stages the tree next to this file.
#
# Tauri has no flatpak target, so this is the standard shape: a manifest that
# installs the staged FHS tree into /app. GNOME's runtime is the one that
# carries WebKitGTK 4.1, which is what the shell links against.
app-id: app.talaria.desktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: talaria-desktop

finish-args:
  # The shell is a client: every instance it shows is remote. Nothing else
  # about the host is shared — no home, no host filesystem.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri # WebKit composites on the GPU wherever it can
  # The sandbox's render node is not the host driver's. Without this,
  # WebKit's DMABUF renderer dies on a Wayland protocol error before a
  # window exists, and a desktop launch is silent. The binary sets the
  # same variable when FLATPAK_ID is present; this covers a packager
  # that ships an older binary.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --talk-name=org.freedesktop.portal.* # browser-based OAuth, when it lands
  # notify/linux.rs speaks the org.freedesktop.Notifications interface
  # straight over the session bus — it has no portal path (yet: W2-D), so the
  # portal grant above does not cover it and every post fails inside the
  # sandbox. Without this line the flatpak build is the one package where
  # notifications never appear.
  - --talk-name=org.freedesktop.Notifications
  # The tray host (background.rs): with a watcher on the bus and the
  # appindicator library, Close hides Talaria to the tray. The GNOME runtime
  # carries no appindicator library, so in the flatpak the probe finds none
  # and Close minimizes instead; the grant is here for a runtime or an
  # extension that does carry one.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The launcher badge (notify/linux.rs emits com.canonical.Unity.LauncherEntry).
  - --talk-name=com.canonical.Unity
  # The single-instance name is app.talaria.desktop.Shell: under the app id,
  # which a flatpak may own with no grant.

modules:
  - name: talaria-desktop
    buildsystem: simple
    sources:
      - type: dir
        path: staging
    build-commands:
      # staging is an FHS tree; /app IS the sandbox's /usr.
      - cp -a usr/. /app/