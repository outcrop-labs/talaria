[package]
name = "talaria-mcp-jsonrpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
axum = { version = "0.8", default-features = false }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
