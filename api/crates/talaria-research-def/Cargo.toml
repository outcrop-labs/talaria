[package]
name = "talaria-research-def"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
talaria-artifacts = { path = "../talaria-artifacts" }
talaria-capability-reach = { path = "../talaria-capability-reach" }
talaria-conversations = { path = "../talaria-conversations" }
talaria-fleet-layout = { path = "../talaria-fleet-layout" }
talaria-harness = { path = "../talaria-harness" }
talaria-harness-defs = { path = "../talaria-harness-defs" }
talaria-kb = { path = "../talaria-kb" }
talaria-model-access = { path = "../talaria-model-access" }
talaria-notify = { path = "../talaria-notify" }
talaria-retrieval = { path = "../talaria-retrieval" }
talaria-runs-define = { path = "../talaria-runs-define" }
talaria-source-registry = { path = "../talaria-source-registry" }
talaria-state = { path = "../talaria-state" }
regex = "1"
talaria-model-roles = { path = "../talaria-model-roles" }
