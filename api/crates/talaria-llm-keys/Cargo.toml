[package]
name = "talaria-llm-keys"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-auth = { path = "../talaria-auth" }
talaria-body = { path = "../talaria-body" }
talaria-permissions = { path = "../talaria-permissions" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
getrandom = "0.3"

serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
