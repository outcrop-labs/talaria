[package]
name = "talaria-outreach"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-agent-writes = { path = "../talaria-agent-writes" }
talaria-conversations = { path = "../talaria-conversations" }
talaria-fleet-layout = { path = "../talaria-fleet-layout" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-google-oauth = { path = "../talaria-google-oauth" }
talaria-harness = { path = "../talaria-harness" }
talaria-harness-defs = { path = "../talaria-harness-defs" }
talaria-notify = { path = "../talaria-notify" }
talaria-scheduler = { path = "../talaria-scheduler" }
talaria-state = { path = "../talaria-state" }
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"

