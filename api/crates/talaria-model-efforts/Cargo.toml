[package]
name = "talaria-model-efforts"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-gateway = { path = "../talaria-gateway" }
talaria-model-catalog = { path = "../talaria-model-catalog" }
talaria-persona = { path = "../talaria-persona" }
talaria-state = { path = "../talaria-state" }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"

