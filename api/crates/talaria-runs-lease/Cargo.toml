[package]
name = "talaria-runs-lease"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
futures-util = "0.3"

tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
