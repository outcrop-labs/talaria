name: talaria-events
version: "1.1.0"
description: Reports tool-call lifecycle (name, arguments, results) to the Talaria platform so run observability can show what the agent actually did, and uploads the PNG a browser screenshot wrote so the turn shows the page rather than a path inside a disposable container. Auth is the agent's own TALARIA_AGENT_KEY; the platform clamps, bounds and scrubs what it stores.
author: Talaria
hooks:
  - pre_tool_call
  - post_tool_call
