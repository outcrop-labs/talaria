name: talaria-events
version: "1.1.0"
description: Reports tool-call lifecycle (name, arguments, results) and a cron turn's final text to the Talaria platform, so run observability can show what the agent actually did and a scheduled turn can answer in the conversation that scheduled it. Auth is the agent's own TALARIA_AGENT_KEY; the platform clamps and scrubs what it stores.
author: Talaria
hooks:
  - pre_tool_call
  - post_tool_call
  - post_llm_call
