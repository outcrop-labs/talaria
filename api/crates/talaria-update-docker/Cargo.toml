[package]
name = "talaria-update-docker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
talaria-fleet-docker = { path = "../talaria-fleet-docker" }
talaria-update-layout = { path = "../talaria-update-layout" }
talaria-update-registry = { path = "../talaria-update-registry" }
tokio = { version = "1", features = ["process", "time", "io-util", "macros"] }
tracing = "0.1"
