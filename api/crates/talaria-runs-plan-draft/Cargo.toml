[package]
name = "talaria-runs-plan-draft"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-channel-plan = { path = "../talaria-channel-plan" }
talaria-harness-defs = { path = "../talaria-harness-defs" }
talaria-runs-define = { path = "../talaria-runs-define" }
talaria-state = { path = "../talaria-state" }
tokio = { version = "1", features = ["macros"] }
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
