[package]
name = "talaria-attribution"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-research-origin = { path = "../talaria-research-origin" }
talaria-users = { path = "../talaria-users" }
