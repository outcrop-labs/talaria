[package]
name = "talaria-digest"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-approvals = { path = "../talaria-approvals" }
talaria-daily-brief = { path = "../talaria-daily-brief" }
talaria-email = { path = "../talaria-email" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-home = { path = "../talaria-home" }
talaria-notify = { path = "../talaria-notify" }
talaria-realtime = { path = "../talaria-realtime" }
talaria-runs-define = { path = "../talaria-runs-define" }
talaria-runs-run = { path = "../talaria-runs-run" }
talaria-scheduler = { path = "../talaria-scheduler" }
talaria-state = { path = "../talaria-state" }
talaria-tz = { path = "../talaria-tz" }
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
