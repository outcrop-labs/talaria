[package]
name = "talaria-runs-define"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"

