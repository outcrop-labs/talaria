[package]
name = "talaria-fleet-cascade"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-defs = { path = "../talaria-agent-defs" }
talaria-fleet-create = { path = "../talaria-fleet-create" }
talaria-fleet-docker = { path = "../talaria-fleet-docker" }
talaria-secretbox = { path = "../talaria-secretbox" }
