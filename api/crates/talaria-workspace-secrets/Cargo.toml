[package]
name = "talaria-workspace-secrets"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
talaria-agent-auth = { path = "../talaria-agent-auth" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
talaria-audit = { path = "../talaria-audit" }
talaria-secretbox = { path = "../talaria-secretbox" }
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
