[package]
name = "talaria-daily-brief-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-gateway = { path = "../talaria-gateway" }
talaria-tz = { path = "../talaria-tz" }
talaria-agent-auth = { path = "../talaria-agent-auth" }
