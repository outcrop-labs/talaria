[package]
name = "talaria-gaps"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-agent-writes = { path = "../talaria-agent-writes" }
talaria-notify = { path = "../talaria-notify" }
talaria-runs-define = { path = "../talaria-runs-define" }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
