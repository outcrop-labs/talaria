[package]
name = "talaria-fleet-brain"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-auth = { path = "../talaria-auth" }
talaria-fleet-layout = { path = "../talaria-fleet-layout" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-llm-keys = { path = "../talaria-llm-keys" }
tokio = { version = "1", features = ["fs", "process", "time", "io-util", "macros"] }
tracing = "0.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
