[package]
name = "talaria-tasks-types"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
futures-util = "0.3"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-error = { path = "../talaria-error" }
talaria-notify = { path = "../talaria-notify" }
talaria-realtime = { path = "../talaria-realtime" }
talaria-runs-run = { path = "../talaria-runs-run" }
