[package]
name = "talaria-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json", "derive"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-fleet-docker = { path = "../talaria-fleet-docker" }
talaria-fleet-layout = { path = "../talaria-fleet-layout" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-mcp-jsonrpc = { path = "../talaria-mcp-jsonrpc" }
talaria-mcp-oauth = { path = "../talaria-mcp-oauth" }
talaria-mcp-service = { path = "../talaria-mcp-service" }
talaria-safe-fetch = { path = "../talaria-safe-fetch" }
talaria-scheduler = { path = "../talaria-scheduler" }
talaria-secretbox = { path = "../talaria-secretbox" }
tokio = { version = "1", features = ["macros", "time", "process"] }
tracing = "0.1"
url = "2"
talaria-undici = { path = "../talaria-undici" }
talaria-users = { path = "../talaria-users" }
