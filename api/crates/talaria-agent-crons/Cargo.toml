[package]
name = "talaria-agent-crons"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-fleet-docker = { path = "../talaria-fleet-docker" }
talaria-gateway = { path = "../talaria-gateway" }
tokio = { version = "1", features = ["time", "macros"] }
tracing = "0.1"
regex = "1"
futures-util = "0.3"
