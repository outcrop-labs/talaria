[package]
name = "talaria-invites"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-email = { path = "../talaria-email" }
talaria-instance = { path = "../talaria-instance" }
talaria-org = { path = "../talaria-org" }
talaria-secretbox = { path = "../talaria-secretbox" }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
getrandom = "0.3"
