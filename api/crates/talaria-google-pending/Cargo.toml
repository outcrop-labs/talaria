[package]
name = "talaria-google-pending"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-google-calendar = { path = "../talaria-google-calendar" }
talaria-google-connections = { path = "../talaria-google-connections" }
talaria-google-gmail = { path = "../talaria-google-gmail" }
talaria-google-org = { path = "../talaria-google-org" }
talaria-notify = { path = "../talaria-notify" }
talaria-realtime = { path = "../talaria-realtime" }
talaria-secretbox = { path = "../talaria-secretbox" }
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
