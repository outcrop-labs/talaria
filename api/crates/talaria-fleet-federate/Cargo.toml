[package]
name = "talaria-fleet-federate"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-defs = { path = "../talaria-agent-defs" }
talaria-fleet-create = { path = "../talaria-fleet-create" }
talaria-fleet-layout = { path = "../talaria-fleet-layout" }
talaria-gateway = { path = "../talaria-gateway" }
tokio = { version = "1", features = ["fs", "macros"] }
tracing = "0.1"
serde_yaml_ng = "0.10"
