[package]
name = "talaria-fleet-layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1", features = ["fs", "rt"] }
