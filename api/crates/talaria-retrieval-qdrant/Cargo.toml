[package]
name = "talaria-retrieval-qdrant"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
talaria-retrieval-http = { path = "../talaria-retrieval-http" }
talaria-retrieval-sparse = { path = "../talaria-retrieval-sparse" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
futures-util = "0.3"
