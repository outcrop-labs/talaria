[package]
name = "talaria-model-info"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-config = { path = "../talaria-config" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-harness = { path = "../talaria-harness" }
talaria-harness-defs = { path = "../talaria-harness-defs" }
talaria-model-access = { path = "../talaria-model-access" }
talaria-scheduler = { path = "../talaria-scheduler" }
talaria-state = { path = "../talaria-state" }
tokio = { version = "1", features = ["macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
