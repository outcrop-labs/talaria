[package]
name = "talaria-fleet-resources"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-fleet-budget = { path = "../talaria-fleet-budget" }
talaria-fleet-docker = { path = "../talaria-fleet-docker" }
talaria-scheduler = { path = "../talaria-scheduler" }
tokio = { version = "1", features = ["process", "time", "io-util", "macros"] }
tracing = "0.1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
