[package]
name = "talaria-update-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml_ng = "0.10"
talaria-update-docker = { path = "../talaria-update-docker" }
talaria-update-layout = { path = "../talaria-update-layout" }
talaria-yaml11 = { path = "../talaria-yaml11" }
tokio = { version = "1", features = ["fs", "io-util"] }
tracing = "0.1"
