[package]
name = "talaria-google-gmail"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-body = { path = "../talaria-body" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-google-client = { path = "../talaria-google-client" }
talaria-google-connections = { path = "../talaria-google-connections" }
talaria-google-errors = { path = "../talaria-google-errors" }
talaria-google-org = { path = "../talaria-google-org" }
talaria-secretbox = { path = "../talaria-secretbox" }
tracing = "0.1"
axum = { version = "0.8", default-features = false }
futures-util = "0.3"
url = "2"
regex = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
