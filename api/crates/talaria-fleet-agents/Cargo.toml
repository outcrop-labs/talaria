[package]
name = "talaria-fleet-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-agents-registry = { path = "../talaria-agents-registry" }
talaria-fleet-docker = { path = "../talaria-fleet-docker" }
talaria-fleet-layout = { path = "../talaria-fleet-layout" }
talaria-users = { path = "../talaria-users" }
