[package]
name = "talaria-instance"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
talaria-settings = { path = "../talaria-settings" }
talaria-agent-auth = { path = "../talaria-agent-auth" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
tokio = { version = "1", features = ["sync", "time"] }
