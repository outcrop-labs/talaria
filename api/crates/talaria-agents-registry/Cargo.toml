[package]
name = "talaria-agents-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
uuid = { version = "1", features = ["v4"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
