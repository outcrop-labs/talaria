[package]
name = "talaria-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
futures-util = "0.3"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }

talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-body = { path = "../talaria-body" }
talaria-email = { path = "../talaria-email" }
talaria-fleet-layout = { path = "../talaria-fleet-layout" }
talaria-instance = { path = "../talaria-instance" }
talaria-push = { path = "../talaria-push" }
talaria-realtime = { path = "../talaria-realtime" }
talaria-scheduler = { path = "../talaria-scheduler" }
talaria-secretbox = { path = "../talaria-secretbox" }
talaria-settings = { path = "../talaria-settings" }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
