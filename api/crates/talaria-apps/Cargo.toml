[package]
name = "talaria-apps"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-mcp-apply = { path = "../talaria-mcp-apply" }
talaria-safe-fetch = { path = "../talaria-safe-fetch" }
talaria-secretbox = { path = "../talaria-secretbox" }
talaria-users = { path = "../talaria-users" }
tokio = { version = "1", features = ["fs", "macros"] }
tracing = "0.1"
