[package]
name = "talaria-google-drive"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-artifacts = { path = "../talaria-artifacts" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-google-connections = { path = "../talaria-google-connections" }
talaria-google-errors = { path = "../talaria-google-errors" }
talaria-google-oauth = { path = "../talaria-google-oauth" }
talaria-google-org = { path = "../talaria-google-org" }
talaria-secretbox = { path = "../talaria-secretbox" }
talaria-uploads = { path = "../talaria-uploads" }
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
base64 = "0.23"
url = "2"
