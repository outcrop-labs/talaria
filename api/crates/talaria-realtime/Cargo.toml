[package]
name = "talaria-realtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
# default-features off, "tokio" on: Sse::keep_alive lives behind the tokio
# feature and this crate is the one that uses it.
axum = { version = "0.8", default-features = false, features = ["tokio"] }
futures-util = "0.3"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
talaria-boards = { path = "../talaria-boards" }
talaria-runs-define = { path = "../talaria-runs-define" }
talaria-users = { path = "../talaria-users" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
