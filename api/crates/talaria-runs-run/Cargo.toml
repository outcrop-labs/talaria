[package]
name = "talaria-runs-run"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
talaria-runs-define = { path = "../talaria-runs-define" }
talaria-runs-drivers = { path = "../talaria-runs-drivers" }
talaria-runs-lease = { path = "../talaria-runs-lease" }
talaria-runs-store = { path = "../talaria-runs-store" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
