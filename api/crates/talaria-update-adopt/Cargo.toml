[package]
name = "talaria-update-adopt"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-fleet-docker = { path = "../talaria-fleet-docker" }
talaria-runs-lease = { path = "../talaria-runs-lease" }
talaria-scheduler = { path = "../talaria-scheduler" }
talaria-state = { path = "../talaria-state" }
talaria-update-docker = { path = "../talaria-update-docker" }
talaria-update-layout = { path = "../talaria-update-layout" }
talaria-update-mode = { path = "../talaria-update-mode" }
talaria-update-registry = { path = "../talaria-update-registry" }
talaria-update-render = { path = "../talaria-update-render" }
talaria-update-state = { path = "../talaria-update-state" }
talaria-yaml11 = { path = "../talaria-yaml11" }
tokio = { version = "1", features = ["fs", "time", "macros", "process"] }
tracing = "0.1"
talaria-update-roll = { path = "../talaria-update-roll" }
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
