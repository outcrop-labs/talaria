[package]
name = "talaria-runs-decide"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-approvals = { path = "../talaria-approvals" }
talaria-notify = { path = "../talaria-notify" }
talaria-realtime = { path = "../talaria-realtime" }
talaria-runs-define = { path = "../talaria-runs-define" }
talaria-runs-run = { path = "../talaria-runs-run" }
talaria-runs-store = { path = "../talaria-runs-store" }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
talaria-realtime-watch = { path = "../talaria-realtime-watch" }
