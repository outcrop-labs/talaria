[package]
name = "talaria-routes-knowledge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-agent-media = { path = "../talaria-agent-media" }
talaria-agent-memory = { path = "../talaria-agent-memory" }
talaria-artifacts = { path = "../talaria-artifacts" }
talaria-attribution = { path = "../talaria-attribution" }
talaria-audit = { path = "../talaria-audit" }
talaria-body = { path = "../talaria-body" }
talaria-error = { path = "../talaria-error" }
talaria-notify = { path = "../talaria-notify" }
talaria-params = { path = "../talaria-params" }
talaria-permissions = { path = "../talaria-permissions" }
talaria-personal-agent = { path = "../talaria-personal-agent" }
talaria-session = { path = "../talaria-session" }
talaria-state = { path = "../talaria-state" }
talaria-teams = { path = "../talaria-teams" }
talaria-templates = { path = "../talaria-templates" }
talaria-uploads = { path = "../talaria-uploads" }
talaria-users = { path = "../talaria-users" }
talaria-web-search = { path = "../talaria-web-search" }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json", "derive"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "process"] }
tracing = "0.1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
talaria-api-facades = { path = "../talaria-api-facades" }
