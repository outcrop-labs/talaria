[package]
name = "talaria-runs-work-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
uuid = { version = "1", features = ["v4"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-artifacts = { path = "../talaria-artifacts" }
talaria-body = { path = "../talaria-body" }
talaria-config = { path = "../talaria-config" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-github = { path = "../talaria-github" }
talaria-harness = { path = "../talaria-harness" }
talaria-harness-defs = { path = "../talaria-harness-defs" }
talaria-runs-define = { path = "../talaria-runs-define" }
talaria-state = { path = "../talaria-state" }
talaria-statuses = { path = "../talaria-statuses" }
talaria-tasks = { path = "../talaria-tasks" }
talaria-workflows = { path = "../talaria-workflows" }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing = "0.1"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
