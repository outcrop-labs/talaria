[package]
name = "talaria-push"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
getrandom = "0.3"

futures-util = "0.3"
hmac = "0.13"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "pkcs8", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-secretbox = { path = "../talaria-secretbox" }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
url = "2"

uuid = { version = "1", features = ["v4"] }
