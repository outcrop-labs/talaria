[package]
name = "talaria-google-oauth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-auth-config = { path = "../talaria-auth-config" }
talaria-error = { path = "../talaria-error" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-google-client = { path = "../talaria-google-client" }
talaria-google-connections = { path = "../talaria-google-connections" }
talaria-google-org = { path = "../talaria-google-org" }
talaria-secretbox = { path = "../talaria-secretbox" }
talaria-session = { path = "../talaria-session" }
talaria-state = { path = "../talaria-state" }
talaria-users = { path = "../talaria-users" }
tracing = "0.1"
url = "2"
