[package]
name = "talaria-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tracing = "0.1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
