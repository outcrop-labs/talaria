[package]
name = "talaria-uploads"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
talaria-agent-auth = { path = "../talaria-agent-auth" }
talaria-boards = { path = "../talaria-boards" }
talaria-body = { path = "../talaria-body" }
talaria-error = { path = "../talaria-error" }
talaria-gateway = { path = "../talaria-gateway" }
talaria-secretbox = { path = "../talaria-secretbox" }
talaria-storage = { path = "../talaria-storage" }
tokio = { version = "1", features = ["fs", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
regex = "1"
