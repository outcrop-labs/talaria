# talaria-api — the Rust successor to the TS fetch handler (ui/src/server).
# Strangler-fig migration: this service takes over route groups one prefix at a
# time; the TS app reverse-proxies migrated prefixes to it. docs/RUST-MIGRATION.md.
#
# Workspace root lives here so `api/target` (dockerignore, package cache
# mounts) stays put. Members land under crates/; this package is still the
# binary + the remaining monolith until later extractions.

[workspace]
# Glob membership: every manifest-bearing dir under crates/ is a member. A new
# crate is picked up by existing; a stray dir without a manifest fails loudly at
# the next cargo invocation rather than being silently absent from a hand list.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# External deps first (the root binary's rationale comments travel with their
# entries), then every workspace crate as a path dep. Manifests say only
# `name = { workspace = true }` — version and features live here, once.
# axum's defaults spelled out explicitly (form/http1/json/matched-path/
# original-uri/query/tokio/tower-log/tracing) plus "multipart" for the uploads
# route's streamed form read (axum keeps the feature opt-in; the
# cap-before-buffer discipline is the route's own). One spec for every crate:
# the 24 that built with defaults on and the 21 that opted out get the same
# surface — default-features=false with nothing implicit left behind.
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "matched-path", "multipart", "original-uri", "query", "tokio", "tower-log", "tracing"] }

# Feature list is the workspace-wide union of what crates asked for (no "full":
# nothing here needs net/parking_lot). "sync" is for the OnceCell-style
# serialization of capability-store writes.
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }

# Host metrics' statvfs. Not a feature of another crate.
libc = "0.2"

tower = { version = "0.5" }

# No `cors` feature on purpose: same-origin throughout (the repo's
# same-origin-fetch invariant). The browser only ever talks to the TS app; the
# TS→Rust hop is server-side.
tower-http = { version = "0.7", features = ["catch-panic", "propagate-header", "request-id", "timeout", "trace"] }

# NO "macros" feature, on purpose: runtime queries only during coexistence.
# The schema moves with the TS MIGRATIONS array (ui/src/server/db/pg.ts —
# append-only, sha256 checksums, advisory lock 8_314_207) and every devbox has
# its own database, so compile-time statement checking would couple this build
# to one devbox's schema. "derive" is for #[derive(FromRow)] structs only.
sqlx = { version = "0.9", default-features = false, features = ["derive", "json", "postgres", "runtime-tokio", "tls-rustls"] }

redis = { version = "1", default-features = false, features = ["aio", "connection-manager", "script", "tokio-comp"] }

# rustls (not rustls-tls — renamed in reqwest 0.13) so nothing links OpenSSL;
# the prod runtime image is bare alpine and must stay that way.
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }

serde = { version = "1", features = ["derive"] }

# preserve_order: Value::Object keeps INSERTION order, like a JS object. The
# guard's annotate path does JSON.parse → mutate → stringify on an upstream
# body and must not alphabetize it (TS preserves the upstream's key order);
# merged upstream bodies likewise keep client-first order like TS's spread.
#
# float_roundtrip: parse floats at full accuracy. The DEFAULT is best-effort
# and can land one ULP off the parsed digits — 0.9090909090909091 came back as
# ...092 on the wire, a byte diff against the stored value TS reads back
# exactly. Scores, prices and ratios all cross jsonb boundaries, so every
# float this API parses (request bodies AND app_settings blobs) needs the
# round-trip-exact parse, not the fast one.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

# serde_json's own ordered map only carries `Value`s (its methods live on
# `Map<String, Value>`), but the fitness index is an ordered map of TYPED
# entries — see the `FitnessIndex` alias in src/fitness/surface.rs. Already a
# transitive dep of serde_json's preserve_order; named here for the typed map.
indexmap = { version = "2", features = ["serde"] }

tracing = { version = "0.1" }

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = { version = "2" }

sha2 = { version = "0.11" }

# skill_summaries' content key — node's createHash('sha1'). Same RustCrypto
# family as sha2; only the digest width differs.
sha1 = { version = "0.10" }

# SigV4's HMAC-SHA256 (storage.ts's createHmac) — same RustCrypto family as
# sha2/aes-gcm/scrypt; hand-rolling HMAC buys nothing.
hmac = { version = "0.13" }

# Web Push's P-256 half (RFC 8291's ECDH + aes128gcm, RFC 8292's ES256 VAPID
# JWT). The `web-push` crate is deliberately NOT used: it pulls OpenSSL, and
# the no-OpenSSL invariant (bare-alpine runtime, rustls everywhere) outranks
# convenience. Pure Rust, same release train as sha2/hmac/aes-gcm above; the
# crypto here is hand-assembled from these primitives with RFC vectors as
# tests.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "pkcs8", "std"] }

# The GitHub App JWT (github.ts appJwt) is RS256 — RSA-SHA256 over a PKCS#8
# PEM. Same RustCrypto family; the sha2 feature wires the digest in.
rsa = { version = "0.9", features = ["sha2"] }

scrypt = { version = "0.12" }

aes-gcm = { version = "0.11" }

base64 = { version = "0.23" }

uuid = { version = "1", features = ["v4"] }

getrandom = { version = "0.3" }

regex = { version = "1" }

url = { version = "2" }

futures-util = { version = "0.3" }

# Wall-clock reads in IANA zones (tz.ts localMoment + the brief/digest clocks).
# "clock" comes from the wall-clock surfaces (google calendar/gmail sync, the
# daily-brief clocks) that read local now(); the scheduler's house rule still
# holds there — engine code takes "now" as epoch ms so it stays testable.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }

# Transactional mail's SMTP leg (email.ts). Hand-rolling the dialect is one
# page of RFC 5321, but hand-rolling the MIME is where silent corruption
# breeds — encoded-word subjects, quoted-printable, multipart/alternative
# boundaries. tokio1 + rustls keeps the no-OpenSSL invariant (alpine runtime).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

serde_yaml_ng = { version = "0.10.0" }

# DNS TXT lookups for org-domain verification (org-domains.ts resolveTxt).
# Async against the system resolver, like node:dns — no need for a DoH
# profile; a verifier that cannot reach DNS reports unverifiable, which is
# the honest answer for that operator anyway.
hickory-resolver = { version = "0.25", default-features = false, features = ["system-config", "tokio"] }

# Declared by crates only (not by the root binary); union of crate specs.
boa_engine = { version = "0.22.0", default-features = false }
toml_edit = "0.25"

# Declared by crates only (not by the root binary); union of crate specs.
hex = { version = "0.4" }

# The skills marketplace unpacks GitHub tarballs (codeload streams a
# tar.gz of the default branch). flate2 defaults to miniz_oxide — pure
# Rust, keeps the no-OpenSSL invariant; tar is the boring reader over it.
flate2 = { version = "1" }
tar = { version = "0.4" }

# Declared by crates only (not by the root binary); union of crate specs.
http = { version = "1" }

