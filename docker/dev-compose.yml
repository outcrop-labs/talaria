# Talaria dev infrastructure — Postgres, Redis, and the retrieval plane
# (Qdrant + a native CPU embedding model via TEI). The app itself runs on the
# host (`bun talaria dev` → vite on :5273); agents render into fleet/ and run
# under the separate `talaria-fleet` compose project.
#
# The sidecar DEFINITIONS — images, restart, data volumes, env defaults,
# healthchecks — are in docker/sidecars.compose.yml, which every compose
# invocation layers IN FRONT of this file (`-f docker/sidecars.compose.yml -f
# docker/dev-compose.yml`, so this file's keys win). What is left here is what
# only the dev loop decides: the loopback publishing and the dev container
# names.
#
# Every published port binds 127.0.0.1 on purpose: these carry dev-default
# credentials (talaria/talaria) and, in Qdrant's and TEI's case, no auth at all,
# so a bare '<port>:<port>' would hand the whole dev stack — and the org's KB
# vectors — to anyone on the laptop's network. The env overrides still work;
# they only choose the host port.
#
# Every image is FULLY QUALIFIED (docker.io/...), in this file and in
# sidecars.compose.yml. A short name like `redis:7-alpine` is resolved by
# whatever unqualified-search registries the local engine is configured with
# (Podman, Rancher Desktop, corporate mirrors, a containerd namespace), which
# on some hosts lands on a different image entirely or on one with no arm64
# manifest. Spelling out the registry makes the pull identical on every
# machine — keep new services qualified too.

name: talaria-dev
services:
  postgres:
    container_name: ${TALARIA_PG_CONTAINER:-talaria-postgres-dev}
    ports:
      - '127.0.0.1:${TALARIA_PG_PORT:-5544}:5432'
    environment:
      # Literal on purpose: the shared default interpolates POSTGRES_PASSWORD,
      # which a deploy checkout's docker/.env can set — the dev app connects
      # with the fixed talaria:talaria in ui/.env.
      POSTGRES_PASSWORD: talaria

  redis:
    container_name: ${TALARIA_REDIS_CONTAINER:-talaria-redis-dev}
    ports:
      - '127.0.0.1:${TALARIA_REDIS_PORT:-6399}:6379'

  qdrant:
    container_name: ${TALARIA_QDRANT_CONTAINER:-talaria-qdrant-dev}
    ports:
      - '127.0.0.1:${TALARIA_QDRANT_PORT:-6333}:6333'

  # The native embedding model (see docker/sidecars.compose.yml for the model
  # and platform notes) on a loopback port, so Admin → Retrieval can be pointed
  # at it by hand.
  embeddings:
    container_name: ${TALARIA_EMBED_CONTAINER:-talaria-embeddings-dev}
    ports:
      - '127.0.0.1:${TALARIA_EMBED_PORT:-8055}:80'

  minio:
    container_name: ${TALARIA_MINIO_CONTAINER:-talaria-minio-dev}
    ports:
      - '127.0.0.1:${TALARIA_MINIO_PORT:-9010}:9000'
    environment:
      # The root pair must match the app's TALARIA_S3_* env — `talaria setup`
      # generates a random secret into ui/.env, which the CLI lifts into this
      # interpolation.
      MINIO_ROOT_PASSWORD: ${TALARIA_S3_SECRET_KEY:-talaria-dev-secret}

  # OPTIONAL native reranker — uncomment to self-host the precision stage
  # (then set provider "Self-hosted (TEI)" + url http://localhost:8056 in
  # Admin → Retrieval). Cloud rerank providers need no container.
  # reranker:
  #   image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
  #   platform: linux/amd64  # same amd64-only image as embeddings (sidecars.compose.yml)
  #   container_name: ${TALARIA_RERANK_CONTAINER:-talaria-reranker-dev}
  #   restart: unless-stopped
  #   command: ['--model-id', '${TALARIA_RERANK_MODEL:-BAAI/bge-reranker-base}']
  #   ports:
  #     - '127.0.0.1:${TALARIA_RERANK_PORT:-8056}:80'
  #   volumes:
  #     - tei-cache:/data
  # LIVE WEB SEARCH — SearXNG, a metasearch aggregator that fans one query
  # across dozens of engines. Talaria's own `web_search` tool talks to its JSON
  # API; see ui/src/server/search.ts for why the client is ours rather than a
  # third-party MCP bridge. The container itself (image, healthcheck, and the
  # AGPL reasoning that keeps it unmodified upstream) is in
  # docker/sidecars.compose.yml; the dev loop adds the loopback port, the base
  # URL the HOST-side app dials, and its rendered settings file.
  searxng:
    container_name: ${TALARIA_SEARCH_CONTAINER:-talaria-searxng-dev}
    ports:
      # LOOPBACK ONLY, like minio. This instance has no authentication of any
      # kind — that is the point of an internal metasearch — so the control that
      # matters is that nothing off this machine can reach it. Publishing it on
      # 0.0.0.0 would hand the network a free, unlogged search proxy.
      - '127.0.0.1:${TALARIA_SEARCH_PORT:-8888}:8080'
    environment:
      # SearXNG builds absolute URLs from this; it must match how Talaria
      # reaches it or the JSON payload carries links nobody can follow. The dev
      # app runs on the host, so its URL is loopback (prod dials searxng:8080).
      SEARXNG_BASE_URL: http://localhost:${TALARIA_SEARCH_PORT:-8888}/
    volumes:
      # The RENDERED file (settings.local.yml), not the template: the secret is
      # generated per install and substituted by `talaria dev`.
      - ../docker/searxng/settings.local.yml:/etc/searxng/settings.yml:ro

volumes:
  # The sidecars' five data volumes are declared in docker/sidecars.compose.yml
  # (the services there reference them).
  searxng-data: {}
