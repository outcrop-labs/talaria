# The dev toolchain, for people and workbench agents alike. `mise install` in
# the repo root gets everything the stack needs to build, including mold,
# which api/.cargo/config.toml links with on x86_64 Linux. A workbench job
# reads this file through prepare_env, so agents building Talaria get the same
# versions without installing anything by hand.
#
# These are the same pins as .github/actions/setup-runtime/action.yml, and
# scripts/check-invariants.mjs fails when the two disagree. Bump both together.
[tools]
rust = "1.97.1"
bun = "1.4.0"
node = "22"
mold = "2"
