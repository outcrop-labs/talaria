# Migration replay — the one CI job with a database.
#
# WHAT THIS DOES
#   On every pull request and every push to main, rc, or testing:
#     - boots a scratch postgres:16-alpine (the exact image prod sidecars run)
#     - replays the ENTIRE MIGRATIONS array against it from zero — proving a
#       fresh database reaches the full schema, and that no statement in the
#       array has a syntax error or bad column reference
#     - runs the pass a second time and requires `applied: 0` (exactly-once,
#       the same property boot relies on after a crash mid-pass)
#     - replays the UPGRADE path too: origin/main's array into a second
#       scratch postgres, then this PR's array on top of it — a mid-array
#       insert or in-place edit trips the append-only checksum guard there,
#       exactly where a deployed instance would trip it at boot
#     - pg_dump --schema-only inside that container and diffs it against the
#       committed ui/src/server/db/schema.snapshot.sql — drift fails with the
#       regen command, so every schema-touching PR carries the real schema
#       diff as its review artifact
#
# WHY A SEPARATE FILE (not a job in ci.yml). ci.yml's contract is service-free
#   and dependency-free, and release.yml runs its jobs via workflow_call as
#   the publish gate — bolting a database onto that call would silently change
#   what a publish costs and checks. This job is its own contract.
#
# WHY `docker run` INSTEAD OF jobs.services. The same container that serves
#   the replay also runs pg_dump, so the dump tool can never skew from the
#   server version — and readiness is pg_isready-polled by us, not raced by
#   the runner. Prod is postgres:16-alpine; so is this.
name: migrations

on:
  # Filtered, unlike ci.yml's triggers: everything this job does hangs off the
  # migration array in ui/src/server/db/pg.ts and the committed schema snapshot
  # beside it, so a UI change, a Rust change or a docs push cannot make this job
  # answer differently. It is not a required check (verified: main's protection
  # asks for a review, no status checks), so a path filter here reports nothing
  # rather than a pending check — and `bun run migrations:check` still runs on
  # every api/... change that could carry SQL, because the api does not own the
  # migrations (api/src/db.rs says so) and cannot touch them.
  pull_request:
    paths:
      - 'ui/src/server/db/**'
      - 'ui/scripts/check-migrations.ts'
      - 'ui/scripts/migrate-file.ts'
      - 'ui/package.json'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main, rc, testing]
    paths:
      - 'ui/src/server/db/**'
      - 'ui/scripts/check-migrations.ts'
      - 'ui/scripts/migrate-file.ts'
      - 'ui/package.json'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Start scratch postgres 16
        run: |
          docker run -d --name talaria-mig-pg \
            -e POSTGRES_USER=talaria -e POSTGRES_PASSWORD=talaria -e POSTGRES_DB=talaria \
            -p 127.0.0.1:55441:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec talaria-mig-pg pg_isready -h 127.0.0.1 -U talaria -q && echo "postgres ready" && exit 0
            sleep 1
          done
          echo "postgres never became ready"; docker logs talaria-mig-pg; exit 1

      - name: Install
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Replay the full migration array
        working-directory: ui
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
          # The pass ends by loading the secretbox, which demands a key even
          # on a schema-only replay. Never a real one — this database dies
          # with the job.
          TALARIA_SECRET_KEY: ci-scratch-key
        run: bun run migrations:check

      # The fresh replay above proves the array runs on a virgin database —
      # which is exactly why it cannot catch a mid-array insert: a fresh
      # database has no ledger, so the append-only guard never fires. Deployed
      # instances DO. (2026-09-18: #394's workchains statements landed
      # mid-array; CI was green, and the first fleet roll refused to boot with
      # "migration 338 changed after it was applied".) This pass is that
      # upgrade, replayed: apply the baseline's array to a second scratch
      # database, then this PR's array against the SAME database — the
      # checksum guard, the appended statements, and the snapshot all have to
      # hold on a database that already has the baseline's ledger, or the PR
      # is red.
      #
      # The baseline is origin/main by default: a PR's array must extend
      # main's without touching existing entries. The repair that introduced
      # this check (#398) pinned e9f08476 instead — main's tip then carried
      # the mid-array insert no deployed database ever applied (the boot
      # guard refused fleet-wide), so the last array any instance actually
      # ran was the honest baseline. Pin a sha here ONLY for that kind of
      # transition, and flip back in the very next migrations PR: a stale
      # baseline weakens the guard to inserts above the pinned prefix.
      - name: Upgrade pass — baseline migrations into a second scratch postgres
        run: |
          git fetch --no-tags --depth=1 origin main
          base="${MIGRATION_BASELINE:-origin/main}"
          echo "upgrade baseline: $base"
          # A pinned baseline sha (set via env above) is an ancestor the
          # depth-1 fetch does not carry — fetch it by sha (GitHub allows
          # want-by-sha) and fail loud rather than silently comparing
          # against the wrong array.
          if ! git cat-file -e "$base" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          git show "$base":ui/src/server/db/pg.ts > ui/src/server/db/pg.main-upgrade.ts
          docker run -d --name talaria-mig-pg-up \
            -e POSTGRES_USER=talaria -e POSTGRES_PASSWORD=talaria -e POSTGRES_DB=talaria \
            -p 127.0.0.1:55442:5432 postgres:16-alpine
          # Probe TCP (-h 127.0.0.1), never the unix socket: the image's
          # initdb phase runs a TEMP server that answers socket probes but
          # has listen_addresses='' — a socket-ready check passes seconds
          # before the real server exists, and the next step's first
          # connection dies with ECONNRESET (seen on the first run of this
          # step; the first container above only dodged it because bun
          # install sat between start and first query).
          for i in $(seq 1 30); do
            docker exec talaria-mig-pg-up pg_isready -h 127.0.0.1 -U talaria -q && break
            sleep 1
          done
          docker exec talaria-mig-pg-up pg_isready -h 127.0.0.1 -U talaria -q \
            || { echo "postgres never became ready"; docker logs talaria-mig-pg-up; exit 1; }

      - name: Upgrade pass — this PR's array on top of main's ledger
        working-directory: ui
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55442/talaria
          TALARIA_SECRET_KEY: ci-scratch-key
          # The snapshot diff must come from THIS database — the upgraded
          # schema has to land where the fresh replay lands.
          PG_DUMP: docker exec talaria-mig-pg-up pg_dump -U talaria
        run: |
          bun run migrate-file src/server/db/pg.main-upgrade.ts
          rm src/server/db/pg.main-upgrade.ts
          bun run migrations:check

      - name: Replay again — nothing new may apply
        working-directory: ui
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
          TALARIA_SECRET_KEY: ci-scratch-key
        run: |
          out=$(bun run migrations:check)
          echo "$out"
          grep -q 'applied: 0' <<<"$out"
