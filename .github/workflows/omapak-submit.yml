# Submit the desktop shell to Omapak when a release rolls.
#
# desktop-package.yml mints desktop-v* (the live updater feed) and release.yml
# publishes stable v* tags. Either one is a new desktop source. This opens a
# pull request on outcrop-labs/omapak that moves apps/app.talaria.desktop to
# that tag and regenerates the vendored cargo/bun sources the offline build
# consumes. The judge still scores it — nothing here merges.
#
# HOW IT IS STARTED. desktop-package.yml calls this at the end of a packaging
# run, passing the tag it just finished. It is NOT driven by the
# `release: published` event alone: both release paths mint their release with
# GITHUB_TOKEN, and GitHub deliberately refuses to start workflow runs from
# events a GITHUB_TOKEN created, so that trigger sat silent through
# desktop-v0.7.0 .. v0.10.0 and the store pin went four versions stale. The
# release trigger stays for a release published by hand (a human token does
# fire it), and workflow_dispatch is the manual door for a tag that missed.
#
# Needs a repository secret OMAPAK_SUBMIT_TOKEN: a fine-grained PAT or GitHub
# App token with contents:write and pull-requests:write on outcrop-labs/omapak.
# GITHUB_TOKEN cannot open a pull request on another repository. A missing
# secret fails the job rather than skipping: a rolled release that never
# reaches the store is a red run, not a quiet success.
name: omapak-submit

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'the tag to submit (desktop-package.yml passes the release it just attached)'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'the tag to submit, e.g. desktop-v0.10.0'
        type: string
        required: true

permissions:
  contents: read

jobs:
  submit:
    name: open the omapak submission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # One gate for all three triggers, reading the release itself rather
      # than an event payload that only exists on one of them.
      - name: Resolve the tag, and skip what must not move the store pin
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::no tag to submit — neither inputs.tag nor a release event"
            exit 1
          fi
          case "$tag" in
            desktop-v*|v[0-9]*) ;;
            *)
              echo "$tag is neither a desktop-v nor a stable v tag — nothing to submit"
              echo "go=false" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Stable only. desktop-v* is never a prerelease; v* RCs are, and an
          # RC must not move the store pin.
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                    --json isPrerelease --jq .isPrerelease)" = true ]; then
            echo "$tag is a prerelease — leaving the store pin where it is"
            echo "go=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "go=true" >>"$GITHUB_OUTPUT"

      - name: Require the omapak token
        if: steps.gate.outputs.go == 'true'
        env:
          TOKEN: ${{ secrets.OMAPAK_SUBMIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::OMAPAK_SUBMIT_TOKEN is not set — a fine-grained PAT or GitHub App token with contents and pull-requests write on outcrop-labs/omapak. See RELEASING.md."
            exit 1
          fi
          # A token that exists but cannot push is the failure that shipped
          # desktop-v0.11.0 without a submission: the clone succeeds (the
          # repo is public), the push answers 403 "Permission … denied", and
          # the sentence names the account rather than the token. Ask GitHub
          # what the token may do BEFORE the work, and say what to regenerate.
          who=$(GH_TOKEN="$TOKEN" gh api user --jq .login 2>/dev/null || echo '?')
          push=$(GH_TOKEN="$TOKEN" gh api repos/outcrop-labs/omapak --jq '.permissions.push // false' 2>/dev/null || echo false)
          if [ "$push" != true ]; then
            echo "::error::OMAPAK_SUBMIT_TOKEN (account: $who) cannot push to outcrop-labs/omapak. Regenerate it as a fine-grained PAT whose repository access lists outcrop-labs/omapak with Contents: read and write and Pull requests: read and write (an expired or repo-less token reads the public repo fine and fails only at the push), then: gh secret set OMAPAK_SUBMIT_TOKEN --repo $GITHUB_REPOSITORY. Re-run this workflow by dispatch with the tag."
            exit 1
          fi
          echo "token for $who may push to outcrop-labs/omapak"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ steps.gate.outputs.tag }}

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'
        with:
          repository: outcrop-labs/omapak
          token: ${{ secrets.OMAPAK_SUBMIT_TOKEN }}
          path: omapak
          ref: main

      - name: Open or update the pull request
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMAPAK_SUBMIT_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          set -eu
          # The checkout above is at the tag, so HEAD is the commit omapak
          # should pin — github.sha is the default branch on a release event.
          COMMIT=$(git rev-parse HEAD)
          branch="submit/app.talaria.desktop-${TAG}"
          git -C omapak config user.name "talaria-release"
          git -C omapak config user.email "talaria-release@users.noreply.github.com"
          git -C omapak fetch origin main
          # Always from main, so a re-run of the same tag replaces the branch
          # instead of stacking a second edit on the previous attempt.
          git -C omapak checkout -B "$branch" origin/main
          node scripts/omapak-desktop-submit.mjs \
            --talaria . \
            --omapak omapak \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --fetch-shas
          git -C omapak add apps/app.talaria.desktop
          if git -C omapak diff --cached --quiet; then
            echo "submission already matches $TAG"
            exit 0
          fi
          git -C omapak commit -m "app.talaria.desktop: track ${TAG}

          Automated submission from the Talaria release. The judge still scores
          this; nothing merges from here."
          git -C omapak push --force-with-lease -u origin "$branch"
          body="Moves \`app.talaria.desktop\` to \`${TAG}\` (\`${COMMIT}\`).

          Vendored cargo and bun sources were regenerated from that tag's lockfiles, and the rust/bun dist pins follow \`rust-toolchain.toml\` and \`setup-runtime\`. The judge scores this like any other submission — merging is still a person's call."
          existing=$(gh pr list --repo outcrop-labs/omapak --head "$branch" --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh pr edit "$existing" --repo outcrop-labs/omapak --title "app.talaria.desktop: ${TAG}" --body "$body"
            echo "updated PR #$existing"
          else
            gh pr create --repo outcrop-labs/omapak --base main --head "$branch" \
              --title "app.talaria.desktop: ${TAG}" --body "$body"
          fi
