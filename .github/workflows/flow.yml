# The branch flow, ENFORCED — the server-side half of docs/BRANCHES.md.
#
# THE MODEL, in one paragraph. Three long-lived branches. `testing` is the
# integration lane: features and back-flows merge into it by pull request.
# `rc` is the release candidate and the staging environment: a push to it runs
# CI and rc-deploy.yml, which builds this commit's image, boots it, and checks
# that it answers — and only once that is green does promote.yml open the
# `rc → main` pull request. Until pull requests move to testing, rc still takes
# them all. `main` is the trunk: it moves one way only, by that promotion
# merge, after rc has been verified.
#
# WHAT IS CHECKED HERE, and why each is a check rather than a sentence in a doc:
#
#   pr-target      every pull request into main, rc or testing. Into any of
#                  them, a title or body that would skip the merge's own push
#                  checks ([skip ci] and kin) is refused. Into rc or main, a
#                  retarget is refused until a push re-runs the checks against
#                  the new base. Into main, only this repository's rc: review,
#                  CI and the staging deploy happen on rc, so a second door
#                  into main is a door with no gates on it.
#   promotion-gate a pull request to main requires rc's head commit to have a
#                  green CI run AND a green rc-deploy run, both made on rc,
#                  read from the Actions API. This is "verified in RC before it
#                  reaches main", checked rather than assumed. The head must
#                  also carry no changelog/ entries: every promotion is a
#                  release, so its changes are rolled into a section first.
#   branch-push    pushes to all three are judged, and none may rewrite or
#                  delete its branch. A push to main may carry only commits
#                  that were already on rc; a push to rc must be a merge commit
#                  (what a PR merge leaves) or a fast-forward of main; a push to
#                  testing, a merge commit or a fast-forward to content rc or
#                  main already carries. The rules and their reasoning:
#                  scripts/flow-guard.mjs.
#
# WHY THE LOGIC IS A SCRIPT AND NOT SHELL IN THIS FILE. scripts/flow-guard.mjs
#   is also run by the git pre-push hook, so the refusal a developer sees
#   locally and the one CI reports cannot drift apart. This file is wiring: an
#   event, a branch, the inputs, and where the policy is read from.
#
# WHY THE POLICY IS READ FROM A REVISION THIS CHANGE CANNOT EDIT. A guard that
#   runs the change's own copy of itself is a guard the change can satisfy by
#   editing it. So each job materializes scripts/flow-guard.mjs from a revision
#   the change cannot reach — for a pull request, the base branch's own tip; for
#   a push, the tip being moved — and refuses outright when that revision is not
#   in the repository at all (a force-push past it, or a clone that never
#   fetched it: the one case where "no guard at that revision" and "no such
#   revision" must not be confused). The `cp` fallback exists for exactly one
#   other case and says so when it takes it: a base that predates the guard,
#   which is the change that introduces it, landing THROUGH this same flow —
#   and `testing` until it is first brought up to rc, because its old tip
#   predates the guard too.
#
# EVERY PULL REQUEST VALUE GOES THROUGH env. The title, body and branch names
#   are text anyone opening a pull request writes; an expression expanded inside
#   `run:` would be that text executed as shell.
#
# DELIBERATELY LEFT OUT (do not read these as oversights)
#   - No `paths:` filters. A guard that skips is not a guard: the cheaper the
#     file, the more it matters that it cannot be skipped. It needs no install
#     and finishes in seconds, which is what makes that affordable.
#   - No fetch of anything but the three long-lived branches. The provenance
#     rules read those refs and nothing else, so that is what the fetch asks for.

name: flow

on:
  pull_request:
    # The long-lived branches, whose rules are this file's subject. A pull
    # request against any other branch is the author's own business.
    branches: [main, rc, testing]
    # `edited` is a recovery path the wait cannot replace. The gate now waits
    # for the tip's CI and rc-deploy runs to finish, so it no longer fails
    # ahead of its own evidence — but a gate that HAS failed (a red deploy,
    # since re-run) is never re-evaluated on its own, and promote.yml's body
    # refresh fires exactly such an edit, re-running this file on the fresh
    # evidence. A hand edit of the body does the same for a repository without
    # the promotion token. And a retarget arrives as an `edited` too, with the
    # old base in `changes.base`, which is what pr-target reads it from.
    types: [opened, synchronize, reopened, edited]
  push:
    # Long-lived branches only: every other push is a feature branch's, and
    # flow-guard.mjs passes those through untouched.
    branches: [main, rc, testing]
  workflow_dispatch: {}

# A new push to the same branch cancels the in-flight run: the answer for the
# replaced commit is no longer anyone's to wait on.
concurrency:
  group: flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-target:
    name: pr target (flow)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          # The base sha has to be readable: it is where the policy comes from.
          fetch-depth: 0

      # The one place a pull request could satisfy this check by editing it.
      # Read the guard from the branch the pull request targets instead.
      - name: Materialize the policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # A base commit that is not in this repository is never a pass, and it
          # is NOT the same thing as a base that predates the guard: the first
          # case means nothing here can judge the pull request, and it is only
          # ever reached by a rewrite the guard exists to refuse.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::$BASE_SHA (the base of this pull request) is not in this repository, so the policy cannot be read from the branch being changed. Fetch the base and push again."
            exit 1
          fi
          if git cat-file -e "$BASE_SHA:scripts/flow-guard.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/flow-guard.mjs" > "$RUNNER_TEMP/flow-guard.mjs"
            echo "policy: $BASE_SHA:scripts/flow-guard.mjs"
          else
            cp scripts/flow-guard.mjs "$RUNNER_TEMP/flow-guard.mjs"
            echo "policy: this pull request's copy — $BASE_SHA predates the guard (see the header)"
          fi

      # The pull request as the guard reads it (flow-guard.mjs, USAGE). An old
      # base's copy of the guard reads only the two branch names and ignores
      # the rest, so the call is safe across the change that adds them.
      - name: Where this pull request comes from, and what its merge would skip
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A deleted fork's head repo is null, so this is false: fail closed.
          FLOW_HEAD_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          FLOW_PR_TITLE: ${{ github.event.pull_request.title }}
          FLOW_PR_BODY: ${{ github.event.pull_request.body }}
          FLOW_ACTION: ${{ github.event.action }}
          # Set only on an `edited` that changed the base: a retarget.
          FLOW_BASE_FROM: ${{ github.event.changes.base.ref.from }}
        run: node "$RUNNER_TEMP/flow-guard.mjs" pr-base "$BASE" "$HEAD" "$BASE_SHA" "$HEAD_SHA"

  # The "verified in RC" rule. Split from pr-target so a red run says WHICH
  # thing is missing: the wrong source branch, or a tip that has not been
  # deployed yet.
  promotion-gate:
    name: promotion gate (rc verified)
    # The promotion only. A pull request into rc or testing is not one, and
    # the job is skipped there (a skipped job is never a pending check).
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    # The gate WAITS for its evidence, and this timeout is the bound on the
    # wait. A synchronize event fires the moment rc is pushed — the same push
    # that STARTS the CI and rc-deploy runs this job reads — so a gate that
    # reads once, immediately, fails before its evidence exists (a cold
    # rc-deploy is twenty minutes and more), and a failed required check is
    # never re-evaluated: every synchronize wedged the promotion until a body
    # edit or a hand re-run happened to fire. The ceiling covers rc-deploy's
    # own worst case, its called api-package job (60) plus the deploy job (30).
    timeout-minutes: 95

    permissions:
      contents: read
      actions: read # the run lookup below

    steps:
      # Queried across ALL workflows rather than by
      # `/actions/workflows/<file>/runs`, and that is deliberate: that endpoint
      # resolves the file path against the DEFAULT branch's workflow list, so a
      # promotion that lands a new workflow file would 404 here — the bootstrap
      # deadlock the release pipeline already paid for once. Runs by head_sha has
      # no such dependency.
      #
      # Only CI and rc-deploy runs made ON rc count: the workflow `name:`, a
      # `head_branch` of rc, and any event but `pull_request`. Push, re-run and
      # dispatch runs on rc verify the same tree, and a dispatched or re-run
      # rc-deploy is the documented recovery from a flaky deploy, so the event
      # is not pinned to `push`. What does not count, though it may be the same
      # sha: a pull_request run (it checked GitHub's merge commit, in whatever
      # mode its base chose), a push to testing (integration mode), a `CI
      # offload` run (light, and another name besides), or release.yml's call
      # (its run carries release's name). check-invariants.mjs
      # (`branch-flow-anchors`) keeps the two names unique to their files, so
      # no other workflow can become this evidence.
      - name: rc's head commit passed CI and deployed in staging
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # One workflow's runs for this commit, folded to a state:
          #   green    a successful run exists — this half is satisfied. ANY
          #            green run, not just the latest: a re-run or a dispatch
          #            after a flake verifies the same tree.
          #   waiting  no green yet and a run has not completed — building,
          #            queued, or re-run in flight.
          #   absent   no run of that workflow at all. The synchronize that
          #            started this gate is the same push that starts them,
          #            so this is seconds at most.
          #   red      every run completed and none was green.
          state() {
            printf '%s' "$runs" | jq -r --arg name "$1" '
              [.workflow_runs[] | select(.name == $name and .event != "pull_request" and .head_branch == "rc")] as $rs
              | if any($rs[]; .conclusion == "success") then "green"
                else ([ $rs[] | select(.status != "completed") ] | length) as $live
                | if $live > 0 then "waiting"
                  elif ($rs | length) == 0 then "absent"
                  else "red" end
                end'
          }

          # Rolled first. Every promotion is a release (tag-release.yml tags
          # main when CHANGELOG.md has an untagged section), and its notes are
          # that section, so a head still carrying changelog/ entries would
          # ship them outside it. promote.yml offers the roll; its merge moves
          # rc, and the `synchronize` it causes runs this gate again.
          if listing=$(gh api "repos/$REPO/contents/changelog?ref=$SHA" 2>&1); then
            entries=$(printf '%s' "$listing" | jq '[.[] | select(.name | endswith(".md"))] | length')
          elif printf '%s' "$listing" | grep -q 'HTTP 404'; then
            entries=0
          else
            echo "::error::could not list changelog/ at $SHA: $listing"
            exit 1
          fi
          if [ "$entries" -gt 0 ]; then
            echo "::error::$SHA carries $entries changelog/ entr$([ "$entries" = 1 ] && echo y || echo ies) that no release section holds. Merge the changelog roll's pull request against rc first (promote.yml opens it; RELEASING.md, \"Promoting to stable\"). This gate runs again when rc moves."
            exit 1
          fi

          waited=0
          absent_since=
          while :; do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100")
            ci=$(state CI)
            deploy=$(state rc-deploy)
            echo "for $SHA (t+${waited}s): CI=$ci · rc-deploy=$deploy"

            if [ "$ci" = green ] && [ "$deploy" = green ]; then
              echo "verified in rc: CI green, staging deploy green"
              exit 0
            fi
            if [ "$ci" = red ]; then
              echo "::error::no green CI run for $SHA. rc's tip has to pass CI before it can reach main — see the run list at https://github.com/$REPO/commit/$SHA/checks"
              exit 1
            fi
            if [ "$deploy" = red ]; then
              echo "::error::no green rc-deploy run for $SHA. rc's tip has to be DEPLOYED and verified in staging before it can reach main — see https://github.com/$REPO/actions/workflows/rc-deploy.yml"
              exit 1
            fi

            # A half with no run AT ALL does not get to wait out the timeout:
            # five minutes with nothing registered means the push that moved
            # rc started nothing — a trigger problem no amount of waiting
            # turns into evidence.
            if [ "$ci" = absent ] || [ "$deploy" = absent ]; then
              if [ -z "$absent_since" ]; then absent_since=$waited; fi
              if [ $((waited - absent_since)) -ge 300 ]; then
                echo "::error::no CI or rc-deploy run was ever registered for $SHA. The push that moved rc starts both — check the workflow trigger lists."
                exit 1
              fi
            else
              absent_since=
            fi

            sleep 30
            waited=$((waited + 30))
          done

  branch-push:
    name: branch push (flow)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          # The pushed commit, its history, and the base sha the rules compare
          # against all have to be present.
          fetch-depth: 0

      # Explicit, not "whatever checkout left behind": flow-guard's provenance
      # rules are about these refs specifically, and a checkout that happens
      # to have them today is not a guarantee. main and rc are fetched
      # strictly — every rule reads one of them. testing is tolerated absent:
      # no rule reads it yet, and a fork or a fresh repository without the lane
      # must still have its main and rc pushes judged.
      - name: Fetch the long-lived branches
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/rc:refs/remotes/origin/rc"
          git fetch --no-tags origin "+refs/heads/testing:refs/remotes/origin/testing" \
            || echo "origin has no testing branch"

      # Same rule as pr-target, other revision: the tip this push moves is the
      # copy of the policy that push is judged by.
      - name: Materialize the policy
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # Two cases, and only one of them is the bootstrap. `cat-file -e
          # "$BEFORE:scripts/…"` is false for both, so without this split the
          # fallback would hand a force-push the pushed tree's own copy of the
          # guard — and a rewrite is the thing this job exists to refuse.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::$BEFORE is not in this repository, so nothing can judge what this push introduces. A force-push past a tip this clone never fetched looks exactly like this. Fetch it and push again."
            exit 1
          fi
          if git cat-file -e "$BEFORE:scripts/flow-guard.mjs" 2>/dev/null; then
            git show "$BEFORE:scripts/flow-guard.mjs" > "$RUNNER_TEMP/flow-guard.mjs"
            echo "policy: $BEFORE:scripts/flow-guard.mjs"
          else
            cp scripts/flow-guard.mjs "$RUNNER_TEMP/flow-guard.mjs"
            echo "policy: the pushed copy — $BEFORE predates the guard (see the header)"
          fi

      - name: Where the pushed commits came from
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node "$RUNNER_TEMP/flow-guard.mjs" push "$REF" "$BEFORE" "$AFTER"