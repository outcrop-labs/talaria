# Tag a release once its promotion lands on main.
#
# THE CHAIN (RELEASING.md is the operator's view of it):
#   1. promote.yml, on a verified rc with changelog/ entries, opens the roll
#      pull request against rc. A person merges it; the version is decided
#      there, in a reviewed CHANGELOG.md section.
#   2. promote.yml, on the verified rc that carries the roll, opens the
#      promotion to main. A person merges it.
#   3. THIS FILE, on that merge: main's CHANGELOG.md now has a top section no
#      tag names yet, so it tags main `vX.Y.Z` and dispatches release.yml at
#      the tag, which publishes the images and the GitHub Release.
#
# WHY A DISPATCH AND NOT THE TAG PUSH. A tag pushed with the workflow token
#   starts no workflow (GitHub's rule, the one promote.yml's header explains),
#   so release.yml's `push: tags:` would never fire for it. A workflow_dispatch
#   is the one event that token CAN start, and release.yml's resolve treats a
#   dispatch at a tag exactly as that tag's push. No secret is needed here.
#
# WHY ONLY ON A MERGE. main moves only by rc's promotion merge (flow-guard.mjs
#   refuses anything else), so HEAD having a second parent is the check that
#   this push is a promotion and not something flow.yml is about to go red on.
#   A section a person already tagged by hand is not pending, and nothing runs.
#
# WHY THE DISPATCH IS LIMITED TO main. Re-running a release whose tag step
#   failed is the dispatch's purpose; a dispatch from any other ref would run a
#   modified copy of this file with `contents: write`.

name: tag-release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One at a time, never cancelled: a cancelled run can leave a tag pushed and
# its release never dispatched.
concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: tag the promoted release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the tag
      actions: write # dispatching release.yml at it
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every tag: "pending" means newer than all of them

      - name: Tag main when its CHANGELOG.md has a section no tag names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(node scripts/release-version.mjs pending)
          if [ -z "$version" ]; then
            echo "CHANGELOG.md's top section is already tagged — this push releases nothing."
            exit 0
          fi
          tag="v$version"
          sha=$(git rev-parse HEAD)
          if ! git rev-parse -q --verify "$sha^2" >/dev/null; then
            echo "::warning::main at ${sha:0:12} carries ## $version but is not a merge — not tagging. main moves only by rc's promotion merge; flow.yml says what went wrong."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "$tag" "$sha"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          {
            echo "## Released $tag"
            echo
            echo "Tagged main at \`${sha:0:12}\` and dispatched release.yml at \`$tag\`: images \`$version\` and \`latest\`, and the GitHub Release with notes from the \`## $version\` section."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::tagged $tag at ${sha:0:12}; release.yml is dispatched at it"
