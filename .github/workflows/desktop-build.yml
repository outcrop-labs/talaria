# Talaria Desktop installer builds — every platform, on demand and on tags.
#
# WHAT THIS IS NOT: part of the PR tripwire. ci.yml's `desktop` job is the
# gate (fmt/clippy/test/typecheck, minutes); BUNDLING is a different animal —
# webkit on linux, wry-native deps everywhere, NSIS on windows, a flatpak
# runtime the size of a small OS — and none of it tells a reviewer anything
# a PR needs. So this workflow runs:
#   - workflow_dispatch — proving a platform still bundles, any time
#   - tags (v*)        — attaching installers to the release the tag cuts
# and uploads its artifacts to the run in both cases.
#
# WHY THE LINUX MATRIX SPLITS BY BUNDLE instead of building deb+rpm+appimage
# in one job: appimage wants the OLDEST glibc you can give it (runners drift
# forward under you), flatpak wants a runtime install measured in gigabytes
# and minutes, and a failure in one bundler should never mask the others.
# Each is independently re-runnable and independently readable.
#
# WHY ubuntu-22.04 (not latest): appimage/portable glibc discipline — a
# binary linked on 24.04's glibc will not run on Debian 12. If the runner
# image is retired, the fallback is a containerized build on a 22.04 image,
# not bumping the runner.
#
# SIGNING: nothing here is signed. macOS dgatekeeps unsigned apps (right
# click → Open), windows SmartScreen warns, linux is linux. Codesigning
# certs + the tauri updater belong to the release story (RELEASING.md) when
# there is something to lose by not having them.

name: desktop build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.bundles }} (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bundles: [deb, rpm, appimage]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libfuse2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build
        run: bunx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: talaria-desktop-${{ matrix.bundles }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error

  linux-flatpak:
    name: flatpak (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Tauri system deps + flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev \
            flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y \
            org.gnome.Sdk//46 org.gnome.Platform//46

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build
        run: bunx tauri build --bundles flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: talaria-desktop-flatpak
          path: desktop/src-tauri/target/release/bundle/flatpak/
          if-no-files-found: error

  macos:
    name: dmg (macOS, universal)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build (universal — one dmg, both architectures)
        run: bunx tauri build --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: talaria-desktop-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error

  windows:
    name: nsis (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build
        run: bunx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: talaria-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/
          if-no-files-found: error

  # Attach whatever the tag built to the release that tag cuts — only on
  # tags, only when a release already exists (release.yml owns cutting
  # releases; this job must never invent one).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-flatpak, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          gh release upload "$GITHUB_REF_NAME" artifacts/**/*.{deb,rpm,AppImage,flatpak,dmg,exe} --clobber \
            || echo "no release for $GITHUB_REF_NAME yet — artifacts remain on the run"
