# Talaria Desktop installers — the shell, packaged for Linux, macOS and Windows.
#
# WHY THIS EXISTS. ci.yml gates the desktop crate (fmt, clippy, tests,
# svelte-check) but has never BUILT an installer: tauri.conf.json shipped with
# an empty `targets` list, so `tauri build` produced a bare binary, and
# docs/DESKTOP.md listed "bundle/installer targets" as deferred on purpose.
# This file is that deferral closed. Every platform's installers are built on
# GitHub's runners and attached to the GitHub Release a version tag opens —
# either a vX.Y.Z cut (release.yml calls this file for exactly that) or the
# auto-minor `desktop-vX.Y.0` this file mints itself for a desktop push to
# main (see THE AUTO-MINOR CHANNEL below).
#
# WHAT EACH PLATFORM GETS
#   linux    deb, rpm and AppImage from Tauri's own bundlers, plus pacman and
#            flatpak — Tauri has no target for either, so packaging/linux and
#            packaging/flatpak build them from ONE staged FHS tree. The AppImage
#            takes a second linuxdeploy pass (packaging/linux/repack-appimage.sh)
#            to drop the build host's libwayland-client, which linuxdeploy
#            otherwise bundles and which aborts the app on any host whose
#            Wayland stack differs from the runner's.
#   macOS    a universal .app inside a .dmg, plus a zipped .app for scripted
#            installs. Universal means both Apple targets ride in one download
#            (Apple silicon and Intel alike).
#   windows  an NSIS .exe always, and an .msi (WiX) only when the stamped
#            version has no pre-release part: Windows product versioning has a
#            numeric fourth field and Tauri's msi bundler refuses anything else,
#            so a `0.0.0-sha…` trunk build and a `0.2.0-rc.1` release ship the
#            .exe while claiming no version they are not. The CLI downloads and
#            drives both toolchains itself.
#
# EVERY ARTIFACT A RUNNER CAN EXERCISE IS EXERCISED. macOS verifies the dmg and
# launches the app; windows installs the installer it just built and launches
# what it installed; linux installs its deb. Each then runs the connect smoke
# (desktop/packaging/connect-smoke.mjs) on that shipped binary: a fake instance
# has to be opened, its page requested and its script run, with the shell still
# up. "Still running twenty seconds later", the check this file started with,
# is what a frozen app passes, and the Windows shell once froze on every first
# open. All of it fails the job before anything is attached to a release. The
# linux AppImage was run on a real Arch host while this file was written (it is
# the artifact whose first build aborted there — see repack-appimage.sh), and
# the deb, rpm and pacman packages were installed in clean containers of their
# own distros.
# What no runner here can test: Gatekeeper and SmartScreen as a USER meets them
# (an artifact built on a runner is never quarantined, and nothing is signed),
# and macOS session isolation, which `data_directory` does not provide
# (docs/DESKTOP.md).
#
# THE VERSION IS INJECTED, NEVER COMMITTED. Git tags are the version authority
# (RELEASING.md) and every version field in the repo still says 0.1.0
# decoratively — so the tag arrives as `tauri build --config`, which merges the
# version into the config for this build only. A release therefore stamps the
# real version into every installer without a version-bump commit. The file
# names carry it as the tag spells it; inside, the Linux packages spell a
# pre-release so it sorts BELOW its release, or the release would not install
# over its RC: the deb and rpm Version `0.2.0~rc.1` (recommend-tray.sh), the
# pacman pkgver `0.2.0rc.1` (pack-pacman.sh).
#
# THE AUTO-MINOR CHANNEL. A push to main that touches desktop/ is a RELEASE:
# `resolve` computes the next minor — the highest suffix-free X.Y.Z across BOTH
# the `v*` (app) and `desktop-v*` tags, minor+1, patch 0 — and after every
# platform job is green, `attach` mints the `desktop-vX.Y.0` tag and a regular
# (non-prerelease) Release carrying latest.json, and marks it Latest once that
# file is on it: the LIVE updater feed, because the shell reads
# /releases/latest/download/latest.json (tauri.conf.json). Installed apps read
# it when someone checks for updates (Check for updates in the launcher or
# Settings); nothing installs an update unasked. GitHub's Latest is ONLY ever
# a desktop-v release: release.yml opens every vX.Y.Z release --latest=false. The
# `desktop-v*` namespace keeps desktop automation from ever firing release.yml
# (its tag trigger is `v[0-9]*`). Auto never crosses a major: a manual major —
# or any stable vX.Y.Z cut — raises the baseline and the +1 resumes from there.
# MAJORS ARE MANUAL: dispatch this workflow with `version=1.0.0,
# publish=true`. A dispatch without publish keeps the artifacts-only rerun
# behavior (`0.0.0-sha<sha12>`, nothing minted).
#
# NOT SIGNED, DELIBERATELY. There is no Apple Developer certificate and no
# Windows signing key in this repo, so macOS builds are not notarized
# (Gatekeeper wants a right-click → Open the first time) and Windows builds
# carry no publisher signature (SmartScreen warns). The macOS app IS ad-hoc
# signed (tauri.macos.conf.json `signingIdentity: "-"`): no identity vouches
# for it, but the signature binds it to `app.talaria.desktop`, which is what
# UNUserNotificationCenter ties notification permission to. The macOS job
# asserts that identity, and runs the notification self-test against it. The honest answer to "is
# this installer really Talaria's?" is to build it from the tag or to read the
# workflow run that produced it — which is why the assets ship with a
# SHA256SUMS. Signing is a provisioning decision, recorded with the other
# deliberate omissions in RELEASING.md.
#
# ONE CARGO BUILD PER RUN, THREE LINUX PACKAGERS. linux-pacman and
# linux-flatpak consume the binary the `linux` job built rather than compiling
# again: the artifact is the app, and a packager only arranges files around it.
#
# WHY THE ATTACH STEP LIVES HERE AND NOT IN release.yml. The assets are this
# file's artifacts; release.yml hands over the tag and the work follows. A
# re-run of this workflow alone re-attaches everything (--clobber), and the
# release body — which release.yml owns — never has to name files this file
# decides the names of.
#
# WHY CANCEL-IN-PROGRESS IS SAFE HERE, unlike in release.yml's publish: nothing
# below moves a channel tag, and the updater feed flips LAST — latest.json is
# moved out of the asset set and uploaded only after every installer, checksum
# and signature is already on the release, so a cancelled run can mint a tag
# but can never ship a feed that points at half a release. --clobber makes a
# re-run idempotent; a cancelled mid-attach mint is finished by dispatching
# with `version` + `release_tag` filled in.
name: desktop-package

on:
  push:
    branches: [main]
    # Paths are safe here (chassis.yml's argument: nothing in this file is a
    # required check) and they keep the trunk build meaningful — a desktop push
    # rebuilds the installers, anything else leaves the last artifacts alone.
    # The launcher also bundles one file from ui/: the dither field, imported
    # as `@dither` (desktop/vite.config.ts), so an edit to it changes what the
    # installers ship as surely as a desktop/ edit does.
    paths:
      - 'desktop/**'
      - 'ui/src/lib/dither-engine.ts'
      - '.github/workflows/desktop-package.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'version to stamp (empty: 0.0.0-sha<sha12>; with publish=true an explicit X.Y.Z is required)'
        type: string
        required: false
      release_tag:
        description: 'release to attach the installers to (empty leaves them as workflow artifacts)'
        type: string
        required: false
      publish:
        description: 'mint desktop-v<version> and publish it (the manual-major door; also finishes a cancelled mint)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'the ref to build (release.yml passes the tag it is publishing)'
        type: string
        required: true
      version:
        description: 'version to stamp (release.yml passes the tag minus v)'
        type: string
        required: true
      release_tag:
        description: 'the release to attach the installers to'
        type: string
        required: false
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read # escalated in `attach` only

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure event→outputs math, no checkout — release.yml's `resolve` in miniature,
  # so one job decides the version every build stamps and whether anything
  # uploads to a release.
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.r.outputs.version }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      mint: ${{ steps.r.outputs.mint }}
    steps:
      - name: Work out what this run builds
        id: r
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_RELEASE_TAG: ${{ inputs.release_tag }}
          IN_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$IN_VERSION"
          tag="$IN_RELEASE_TAG"
          mint=false
          if [ -z "$version" ]; then
            if [ "$REF_TYPE" = tag ]; then
              case "$REF_NAME" in
                v[0-9]*.[0-9]*.[0-9]*)
                  version="${REF_NAME#v}"
                  [ -n "$tag" ] || tag="$REF_NAME" ;;
                *)
                  echo "::error::$REF_NAME is neither vX.Y.Z nor vX.Y.Z-rc.N — refusing to stamp a version nobody can reconstruct."
                  exit 1 ;;
              esac
            elif [ "$EVENT_NAME" = push ]; then
              # THE AUTO-MINOR: one monotonic line shared with app releases.
              # Highest suffix-free X.Y.Z across BOTH tag namespaces (RCs and
              # every other shape never move the baseline), minor+1, patch 0.
              # gh api over a checkout: resolve stays checkout-free.
              tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" \
                --jq '.[].name' \
                | grep -E '^(v|desktop-v)[0-9]+\.[0-9]+\.[0-9]+$' || true)
              best=$(printf '%s\n' $tags | sed -E 's/^desktop-v//; s/^v//' \
                | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
              best=${best:-0.0.0}
              maj=${best%%.*}
              rest=${best#*.}
              min=${rest%%.*}
              version="$maj.$((min+1)).0"
              tag="desktop-v$version"
              mint=true
            elif [ "$IN_PUBLISH" = true ]; then
              echo "::error::publish=true needs an explicit X.Y.Z version — fill the version input."
              exit 1
            else
              # A plain dispatch rerun: artifacts only, nothing minted.
              version="0.0.0-sha$(echo "$SHA" | cut -c1-12)"
            fi
          elif [ "$IN_PUBLISH" = true ]; then
            # THE MANUAL MAJOR (or any hand-picked number): validated loudly so
            # a typo can never mint a forever-tag.
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::publish=true needs an explicit X.Y.Z version, got '$version'."
              exit 1
            fi
            [ -n "$tag" ] || tag="desktop-v$version"
            mint=true
          fi
          {
            echo "version=$version"
            echo "release_tag=$tag"
            echo "mint=$mint"
          } >> "$GITHUB_OUTPUT"
          echo "building version $version (release: ${tag:-<none, artifacts only>}, mint: $mint)"

  linux:
    name: linux (deb + rpm + appimage)
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Rust + Bun + Node and the frozen desktop install, with the pins this
      # repo runs on; desktop/src-tauri/rust-toolchain.toml pins the same
      # toolchain and devboxes install the same one.
      - uses: ./.github/actions/setup-runtime
        with:
          install-dir: desktop

      # release-profile cargo build of the whole tauri tree — minutes cold,
      # and the one place in this file where a cache pays for itself.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # webkit2gtk/gtk sys crates probe these at build-script time (ci.yml's
      # desktop job says the same), and `rpm` is the only extra: its
      # /usr/bin/rpmbuild is what Tauri's rpm bundler shells out to. dpkg is
      # NOT needed — the deb bundler writes its own ar members.
      # libayatana-appindicator3-dev: the shell has a tray (background.rs), and
      # with tauri's tray-icon feature the bundler asks pkg-config where the
      # appindicator library lives — it puts it in the AppImage, and makes the
      # deb and rpm depend on it — and aborts the build when it cannot find one.
      # rpm2cpio and cpio: the step after the build rewrites that dependency
      # into a recommendation (packaging/linux/recommend-tray.sh).
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev rpm rpm2cpio cpio

      # The bundle targets come from tauri.linux.conf.json (tauri merges the
      # platform file automatically); --config adds the version on top. The
      # AppImage bundler downloads linuxdeploy and runs it — Tauri sets
      # APPIMAGE_EXTRACT_AND_RUN, so no FUSE is required on the runner.
      - name: Build bundles
        working-directory: desktop
        run: bun run build -- --config "{\"version\":\"$VERSION\"}"

      # The shell opens the tray library with dlopen and runs without it
      # (Close minimizes instead of hiding to a tray nobody can see), but the
      # bundler makes it a hard dependency of the deb and the rpm. The config
      # lists it under `recommends`; this takes it out of Depends and
      # Requires, and checks both packages afterwards (the script's header).
      # The same rewrite spells a pre-release Version with `~`, which dpkg and
      # rpm sort below the release (tauri writes the tag's `-`, which both
      # sort above it).
      - name: The tray library is recommended, not required; an RC sorts below its release
        working-directory: desktop
        run: |
          set -eu
          packaging/linux/recommend-tray.sh src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm

      # The AppImage gets one more pass, on this same runner: linuxdeploy's gtk
      # plugin bundles the build distro's libwayland-client, which aborts on a
      # host with a different Wayland stack (see the script's header). tauri has
      # no way to ask it not to, so the AppDir is trimmed and linuxdeploy runs
      # again with an exclusion that keeps it out.
      - name: Repack the AppImage without the build host's Wayland client
        working-directory: desktop
        run: packaging/linux/repack-appimage.sh src-tauri/target/release/bundle/appimage "$VERSION"

      - name: Collect installers
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          set -eu
          # The deb's Depends is deliberately NOT in tauri.linux.conf.json: the
          # bundler appends its own defaults (libwebkit2gtk-4.1-0, libgtk-3-0)
          # and a list here would only duplicate them. That makes the retro
          # dependencies implicit, so assert them instead — a bundler that ever
          # stopped declaring them would produce an installer that fails at
          # startup, and this is the moment to find out.
          deps=$(dpkg-deb -f deb/*.deb Depends)
          echo "deb Depends: $deps"
          case "$deps" in
            *webkit2gtk*gtk-3*) ;;
            *) echo "::error::the deb declares no webkit2gtk/gtk dependency — see docs/DESKTOP.md (installers)"; exit 1 ;;
          esac
          # The window's Wayland app_id (and X11 WM_CLASS) is the GTK
          # application id, app.talaria.desktop: the deb and rpm desktop file
          # (Talaria.desktop, never renamed) must name it, or a dock cannot
          # group the window under its pin.
          for pkg in deb/*.deb; do
            dpkg-deb --fsys-tarfile "$pkg" | tar -xO --wildcards '*usr/share/applications/Talaria.desktop' | tee "$RUNNER_TEMP/Talaria.desktop"
            grep -qx 'StartupWMClass=app.talaria.desktop' "$RUNNER_TEMP/Talaria.desktop" \
              || { echo "::error::$pkg's Talaria.desktop does not name StartupWMClass=app.talaria.desktop"; exit 1; }
          done
          # The stamped version, as the packages spell it: the pre-release `-`
          # is `~` (recommend-tray.sh), so `0.2.0-rc.1` is `0.2.0~rc.1`.
          want=$(printf '%s' "$VERSION" | sed 's/-/~/; s/-/./g')
          deb_version=$(dpkg-deb -f deb/*.deb Version)
          rpm_version=$(rpm -qp --qf '%{VERSION}' rpm/*.rpm)
          echo "stamped $VERSION: deb Version $deb_version, rpm Version $rpm_version"
          [ "$deb_version" = "$want" ] && [ "$rpm_version" = "$want" ] \
            || { echo "::error::the deb and rpm should carry Version $want for $VERSION"; exit 1; }
          mkdir -p "$RUNNER_TEMP/assets"
          cp deb/*.deb rpm/*.rpm appimage/*.AppImage "$RUNNER_TEMP/assets/"
          ls -l "$RUNNER_TEMP/assets"

      # The deb this run built, installed with apt (so its Depends have to
      # resolve on a stock Ubuntu), and the connect smoke the windows job runs
      # (see there) against the binary it installed, under a private X display
      # and session bus with software rendering, as ci.yml's desktop job does.
      # The rpm, pacman and flatpak packages carry the same binary; the
      # AppImage bundles its own libraries and is not run here (its first
      # build aborted only on a host whose Wayland stack differed from the
      # runner's, which this runner cannot be).
      - name: Install the deb and run the connect smoke on it
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -eu
          deb=$(ls "$RUNNER_TEMP"/assets/*.deb)
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus "$deb"
          # The package's name and its binary's path, read from what was
          # installed rather than assumed: both are the bundler's to choose.
          pkg=$(dpkg-deb -f "$deb" Package)
          exe=$(dpkg -L "$pkg" | grep -m1 '^/usr/bin/' || true)
          [ -n "$exe" ] && [ -x "$exe" ] \
            || { echo "::error::the $pkg deb installed no executable under /usr/bin:"; dpkg -L "$pkg"; exit 1; }
          echo "installed $pkg; its binary is $exe"
          xvfb-run -a dbus-run-session -- node desktop/packaging/connect-smoke.mjs "$exe" --wait 90 --force

      - name: Sign the AppImage for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          img=$(ls "$RUNNER_TEMP/assets"/*.AppImage)
          desktop/packaging/sign-update.sh "$img"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

      # The pacman and flatpak jobs package THIS binary. Artifacts do not carry
      # the executable bit reliably, which is why both jobs chmod it back.
      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: desktop/src-tauri/target/release/talaria-desktop
          if-no-files-found: error

  linux-pacman:
    name: linux (pacman)
    needs: [resolve, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: binary-linux
          path: build

      - name: Stage and pack
        run: |
          set -eu
          chmod +x build/talaria-desktop
          desktop/packaging/linux/stage.sh build/talaria-desktop "$RUNNER_TEMP/tree"
          mkdir -p "$RUNNER_TEMP/assets"
          desktop/packaging/linux/pack-pacman.sh \
            "$RUNNER_TEMP/tree" "$VERSION" \
            "$RUNNER_TEMP/assets/Talaria-$VERSION-$(uname -m).pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-pacman
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

  linux-flatpak:
    name: linux (flatpak)
    needs: [resolve, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      # Keep in step with packaging/flatpak/app.talaria.desktop.yml's
      # runtime-version — this is the runtime the manifest is built against.
      RUNTIME: '50'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: binary-linux
          path: build

      - name: Flatpak tools + the GNOME runtime
        run: |
          set -eu
          sudo apt-get update
          # elfutils is flatpak-builder's stripping step: without eu-strip it
          # fails after the module builds, which is where the first run of this
          # job stopped.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          # Ubuntu 24.04 restricts unprivileged user namespaces (AppArmor), and
          # bwrap — the sandbox flatpak-builder builds inside — is exactly that.
          # Tolerated if absent: the knob is a runner-image detail, and a
          # sandbox that still refuses will say so in the build's own log.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub \
            "org.gnome.Platform//$RUNTIME" "org.gnome.Sdk//$RUNTIME"

      - name: Build the bundle
        run: |
          set -eu
          chmod +x build/talaria-desktop
          desktop/packaging/flatpak/build.sh \
            build/talaria-desktop "$VERSION" "$RUNNER_TEMP/assets"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-flatpak
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

  macos:
    name: macos (dmg)
    needs: [resolve]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          install-dir: desktop

      # universal-apple-darwin is a lipo of both, and tauri refuses the target
      # without both installed. The runner is arm64; the Intel slice is a
      # cross-build, which is why the rustup target matters more than the host.
      - name: Add the Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build bundles
        working-directory: desktop
        run: bun run build -- --target universal-apple-darwin --config "{\"version\":\"$VERSION\"}"

      # The identity notifications hang on (D5): an ad-hoc signature over the
      # whole bundle, identifier app.talaria.desktop, and the binary linked
      # against UserNotifications. A bundle that loses any of these posts
      # nothing, or posts as someone else.
      - name: Check the signature and the bundle identity
        working-directory: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: |
          set -eu
          codesign -dv --verbose=4 Talaria.app 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -qx 'Identifier=app.talaria.desktop' "$RUNNER_TEMP/codesign.txt" \
            || { echo "::error::the bundle is not signed as app.talaria.desktop"; exit 1; }
          grep -qx 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt" \
            || { echo "::error::the bundle is not ad-hoc signed (signingIdentity in tauri.macos.conf.json)"; exit 1; }
          codesign --verify --deep --strict --verbose=2 Talaria.app
          otool -L Talaria.app/Contents/MacOS/talaria-desktop | tee "$RUNNER_TEMP/otool.txt"
          grep -q 'UserNotifications.framework' "$RUNNER_TEMP/otool.txt" \
            || { echo "::error::the binary does not link UserNotifications"; exit 1; }
          id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Talaria.app/Contents/Info.plist)
          echo "CFBundleIdentifier=$id"
          [ "$id" = app.talaria.desktop ] || { echo "::error::CFBundleIdentifier is $id"; exit 1; }

      - name: Collect installers
        working-directory: desktop/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/assets"
          cp dmg/*.dmg "$RUNNER_TEMP/assets/"
          # The .app rides along zipped: dragging from a dmg is the human path,
          # and a zip is the one scripted installs can fetch and unpack.
          ditto -c -k --keepParent macos/Talaria.app \
            "$RUNNER_TEMP/assets/Talaria-$VERSION-universal.app.zip"
          # The updater wants a .tar.gz of the same .app (not the dmg, not the zip).
          tar -C macos -czf "$RUNNER_TEMP/assets/Talaria-$VERSION-universal.app.tar.gz" Talaria.app
          ls -l "$RUNNER_TEMP/assets"

      - name: Sign the app archive for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          desktop/packaging/sign-update.sh "$RUNNER_TEMP/assets/Talaria-$VERSION-universal.app.tar.gz"
      # The dmg's payload is LAUNCHED here, not just built: an unsigned,
      # universal WKWebView app that cannot come up on a Mac is not something a
      # release should carry, and this runner is the only Mac in the pipeline.
      # Gatekeeper is deliberately not part of this test — nothing downloaded the
      # bundle, so nothing quarantined it; what this proves is that the dmg
      # mounts, the binary starts, and it is still running twenty seconds later.
      - name: Smoke test the app bundle
        run: |
          set -eu
          # The dmg is VERIFIED rather than mounted: hdiutil refuses to attach on
          # this runner — "attach canceled", with or without an explicit
          # -mountpoint — because there is no login session for DiskArbitration to
          # hand a volume to. That is a property of the runner, not of the image,
          # and hdiutil verify still reads and checksums the whole thing.
          hdiutil verify "$RUNNER_TEMP/assets"/*.dmg

          # The payload it carries is the same .app the zip does, so the launch
          # happens from there: one bundle, two containers.
          app=$RUNNER_TEMP/app
          mkdir -p "$app"
          ditto -x -k "$RUNNER_TEMP/assets"/*.app.zip "$app"
          exe=$app/Talaria.app/Contents/MacOS/talaria-desktop
          if [ ! -x "$exe" ]; then
            echo "::error::the zip carries no launchable Talaria.app:"
            find "$app" -maxdepth 4 | head -30
            exit 1
          fi

          # The notification self-test (notify/macos.rs), launched through
          # LaunchServices so it runs as the bundle a person opens: backend
          # "un", the bundle id, the authorization (notDetermined on a fresh
          # runner), and a post that AGREES with it — an error unless
          # authorized, never a silent success. Direct exec is the fallback
          # when this runner has no session for `open`.
          st=$RUNNER_TEMP/st.json
          rm -f "$st"
          open -n "$app/Talaria.app" --args "--notify-selftest=$st" || true
          for _ in $(seq 1 30); do [ -s "$st" ] && break; sleep 1; done
          if [ ! -s "$st" ]; then
            echo "open did not run the self-test; running the bundle's binary directly"
            "$exe" "--notify-selftest=$st"
          fi
          cat "$st"
          python3 - "$st" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r["backend"] == "un", r
          assert r["bundleId"] == "app.talaria.desktop", r
          auth = r["authorization"]
          assert auth and not auth.startswith("error"), r
          granted = auth in ("authorized", "provisional", "ephemeral")
          assert (r["post"] == "ok") == granted, f"post {r['post']!r} disagrees with authorization {auth!r}"
          # Read-sync's removal and presence's idle time (I-16, I-22).
          close = str(r.get("close", ""))
          assert close == "ok" or close.startswith("error"), r
          assert isinstance(r.get("osIdle"), (int, float)) and not isinstance(r.get("osIdle"), bool), r
          print(f"self-test: un, {r['bundleId']}, {auth}, post: {r['post']}, close: {close}, osIdle: {r['osIdle']} ms")
          PY
          # The same flag on the binary outside its bundle: UN cannot run
          # there, and the status must say which path it took instead.
          cp "$exe" "$RUNNER_TEMP/talaria-desktop-bare"
          "$RUNNER_TEMP/talaria-desktop-bare" "--notify-selftest=$RUNNER_TEMP/st-bare.json"
          cat "$RUNNER_TEMP/st-bare.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["backend"] == "ns-legacy (unbundled dev run)", r' \
            "$RUNNER_TEMP/st-bare.json"

          "$exe" >"$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the app exited within 20s — its output:"
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          echo "app still running after 20s (pid $pid)"
          lsappinfo list 2>/dev/null | grep -i -m1 talaria \
            || echo "(not registered with LaunchServices — the process is alive regardless)"
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true

      # The same connect smoke the windows job runs on its installed exe (see
      # there): the bundle's own binary, extracted from the zip above, opens a
      # fake instance or fails, which "still running after 20 s" cannot tell
      # apart from a hang.
      - name: Connect smoke on the shipped app
        run: node desktop/packaging/connect-smoke.mjs "$RUNNER_TEMP/app/Talaria.app/Contents/MacOS/talaria-desktop" --wait 90 --force

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

  windows:
    name: windows (nsis + msi)
    needs: [resolve]
    runs-on: windows-latest
    timeout-minutes: 60
    # One shell for every step: quoting the version JSON into a native binary is
    # the same problem in every leg, and bash solves it the same way in all
    # three (windows runners ship Git Bash).
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          install-dir: desktop

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # NSIS is downloaded by the CLI on first use, and WiX for the msi (that is
      # what tauri.windows.conf.json's downloadBootstrapper is about, one level
      # up at install time for WebView2).
      #
      # The msi is added only for a version with no pre-release part: Windows
      # product versioning has a numeric fourth field, and Tauri's msi bundler
      # refuses anything else ("optional pre-release identifier in app version
      # must be numeric-only" — the first run of this job stopped there, after
      # nsis had already built). An RC's honest version is `0.2.0-rc.1`, so an
      # RC ships the nsis installer and no msi, rather than an msi claiming to
      # be `0.2.0`. The platform config keeps both targets for local builds,
      # where the version is the decorative 0.1.0.
      - name: Build bundles
        working-directory: desktop
        run: |
          set -eu
          bundles=nsis
          case "$VERSION" in
            *-*) ;;
            *) bundles=nsis,msi ;;
          esac
          echo "bundling: $bundles (version $VERSION)"
          bun run build -- --bundles "$bundles" --config "{\"version\":\"$VERSION\"}"

      - name: Collect installers
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/assets"
          cp nsis/*.exe "$RUNNER_TEMP/assets/"
          if [ -d msi ]; then cp msi/*.msi "$RUNNER_TEMP/assets/"; fi
          ls -l "$RUNNER_TEMP/assets"

      - name: Sign the NSIS installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          exe=$(ls "$RUNNER_TEMP/assets"/*-setup.exe)
          desktop/packaging/sign-update.sh "$exe"
      # Install the artifact a release would carry and RUN it — an installer
      # that will not install, or an app that will not start, fails here instead
      # of on a user's machine. Whichever installer this run produced is the one
      # tested: the msi when the version was stable enough to have one, the nsis
      # setup otherwise. PowerShell drives it because the parts that matter
      # (msiexec, Start-Process, finding the installed exe) are its native work.
      - name: Smoke test the installer
        run: |
          set -eu
          cat >"$RUNNER_TEMP/smoke.ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          $msi = Get-ChildItem (Join-Path $assets '*.msi') -ErrorAction SilentlyContinue
          if ($msi) {
            Write-Host "installing $($msi.FullName)"
            Start-Process msiexec.exe -Wait -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart')
          } else {
            $setup = Get-ChildItem (Join-Path $assets '*setup.exe') | Select-Object -First 1
            Write-Host "installing $($setup.FullName)"
            Start-Process $setup.FullName -Wait -ArgumentList @('/S')
          }
          Start-Sleep -Seconds 15   # the installer's own children settle after it returns
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Filter talaria-desktop.exe -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'talaria-desktop.exe was not installed where an installer should have put it' }
          Write-Host "installed at $($exe.FullName)"
          # For the connect smoke after this step. AppendAllText writes UTF-8
          # with no BOM, which GITHUB_ENV needs (Windows PowerShell's Out-File
          # -Encoding utf8 writes one).
          [IO.File]::AppendAllText($env:GITHUB_ENV, "INSTALLED_EXE=$($exe.FullName)`n")
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
          if (-not $text.Contains('app.talaria.desktop')) { throw 'the installed exe does not carry app.talaria.desktop' }
          # The notification self-test (notify/windows.rs): toasts must be
          # attributed to Talaria's own AUMID, by the installer's shortcut or
          # the registry entry, never PowerShell's.
          $st = Join-Path $env:RUNNER_TEMP 'st.json'
          Start-Process $exe.FullName -ArgumentList "--notify-selftest=$st" -Wait
          $report = Get-Content $st -Raw
          Write-Host $report
          $r = $report | ConvertFrom-Json
          if ($r.attribution -notin @('shortcut', 'registry')) { throw "toasts are attributed by $($r.attribution)" }
          if ($r.aumid -ne 'app.talaria.desktop') { throw "the AUMID is $($r.aumid)" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "the app exited within 20s (code $($app.ExitCode))" }
          Write-Host "app still running after 20s (pid $($app.Id))"
          # The whole tree, WebView2's msedgewebview2.exe children included, so
          # the connect smoke below starts a shell with nothing of this one left.
          taskkill /PID $app.Id /T /F | Out-Null
          Wait-Process -Id $app.Id -Timeout 30 -ErrorAction SilentlyContinue
          PS
          powershell -NoProfile -ExecutionPolicy Bypass -File "$RUNNER_TEMP/smoke.ps1"

      # "Still running after 20 s" is what a FROZEN app passes: the first open of
      # an instance froze the Windows shell for good (a webview created inside a
      # WebView2 IPC callback), and the process stayed up and kept repainting.
      # The connect smoke (desktop/packaging/connect-smoke.mjs; ci.yml runs it on
      # every desktop pull request against a debug build) passes only when the
      # shell actually opens an instance: a fake one on 127.0.0.1 is the last
      # view in the registry, and its page has to be requested and its script
      # run within 90 s, with the shell still up. Here it runs against the exe
      # the installer put on the runner, the build a user gets. --force: this
      # runner is thrown away, and the launches above may have written the
      # registry the smoke replaces. The script prints which step happened last
      # on a failure.
      - name: Connect smoke on the installed app
        run: node desktop/packaging/connect-smoke.mjs "$INSTALLED_EXE" --wait 90 --force

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

  # The only job that writes to anything outside the run: every installer, a
  # checksum list, and latest.json for the in-app updater, onto the release.
  # It runs last so a half-built release never looks complete. The release is
  # either release.yml's (a vX.Y.Z cut, via workflow_call) or one this job
  # opens itself for a minted desktop-v tag — the gate is simply "a
  # release_tag exists".
  attach:
    name: attach installers to the release
    needs: [resolve, linux, linux-pacman, linux-flatpak, macos, windows]
    if: needs.resolve.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release asset upload
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # THE MINT. For desktop-v runs (auto-minor on a desktop push, or a manual
      # publish dispatch) the tag and its release do not exist until this
      # moment — every platform job is green, so the tag can never point at a
      # broken build. --target mints the lightweight tag in the same call; no
      # git push, and nothing re-triggers (this workflow has no tags trigger
      # and desktop-v* cannot match release.yml's v[0-9]*). NOT --prerelease:
      # /releases/latest must resolve to this release for the updater feed,
      # and a prerelease can never be Latest. But not Latest YET either
      # (--latest=false): GitHub makes a new release Latest by default, and
      # this one has no latest.json until the Upload step, so the feed would
      # 404 for every installed app in between. Upload marks it Latest, last.
      # Create-not-clobber: a losing racer fails loudly instead of stacking a
      # second build's assets onto the winner's release.
      - name: Open the desktop release
        if: needs.resolve.outputs.mint == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists — attaching into it (a re-run or a finished mint)"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --title "$TAG" --latest=false \
              --notes "Desktop auto-minor build at ${SHA:0:12}. What changed: CHANGELOG.md."
          fi

      # packages-* only: binary-linux is an input to the two extra packagers,
      # not a download anyone should be handed.
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: assets

      # Suffix-free versions only: the feed is GitHub's Latest release, and an
      # RC must never reach it. A vX.Y.Z release gets the file too, though
      # nothing serves it: only a desktop-v mint is ever Latest (the Upload
      # step). Missing signatures
      # fail the job — shipping a release the installed app cannot update to
      # is worse than a red attach. On a minted desktop-v release the manifest
      # is the point of the channel, so its absence is an error, not a skip.
      - name: Updater manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          MINT: ${{ needs.resolve.outputs.mint }}
        run: |
          set -eu
          case "$VERSION" in
            *-*)
              echo "prerelease $VERSION — no latest.json (the updater reads /releases/latest)"
              ;;
            *)
              python3 desktop/packaging/write-latest-json.py \
                "$VERSION" "$TAG" "$GITHUB_REPOSITORY" assets
              ;;
          esac
          if [ "$MINT" = true ] && [ ! -f assets/latest.json ]; then
            echo "::error::a minted desktop-v release must flip the updater feed, and latest.json is missing (signing secret absent?)"
            exit 1
          fi
          # The manifest is the updater FEED: it moves out of the asset set so
          # the checksums and the bulk upload land first and the feed flips
          # only after every installer it points at is already on the release.
          if [ -f assets/latest.json ]; then
            mv assets/latest.json ./latest.json
          fi

      # Written to a file outside `assets` first: a redirect creates its target
      # before the glob expands, so the obvious one-liner hashes an empty
      # SHA256SUMS into SHA256SUMS.
      - name: Checksums
        run: |
          set -eu
          cd assets
          sha256sum ./* >"../SHA256SUMS"
          mv ../SHA256SUMS ./SHA256SUMS
          cat SHA256SUMS

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          MINT: ${{ needs.resolve.outputs.mint }}
        run: |
          set -eu
          ls -l assets
          # --repo, explicitly: `gh` can resolve the repository from the
          # checkout, but naming it keeps this step honest if the checkout
          # ever goes away again.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" assets/* --clobber
          # THE FEED FLIPS LAST — see the manifest step.
          if [ -f ./latest.json ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" latest.json --clobber
          fi
          # ...and only now does a minted desktop-v release become GitHub's
          # Latest, which is what /releases/latest/download/latest.json
          # resolves through: the previous desktop release stays the feed until
          # this one carries its own latest.json. Explicit, never GitHub's
          # automatic pick, because the feed must be the newest DESKTOP
          # release. A vX.Y.Z release (release.yml's, which this file only
          # attaches into) is never Latest: release.yml creates it
          # --latest=false, its latest.json is a download nothing reads, and
          # the desktop line moves on at the next desktop-v mint.
          # check-invariants.mjs (`release-latest-is-the-desktop-feed`) holds
          # this flag and release.yml's.
          if [ "$MINT" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
            echo "$TAG is now the Latest release: the updater feed"
          fi
          echo "attached $(ls assets | wc -l) files to $TAG"
  # A published desktop release has to move omapak's pin, or the store keeps
  # shipping the previous tag. Called from here rather than left to
  # omapak-submit.yml's `release: published` trigger: the mint above uses
  # GITHUB_TOKEN, and GitHub deliberately does not start workflow runs from
  # events a GITHUB_TOKEN created, so that trigger never fired once —
  # desktop-v0.7.0 through v0.10.0 all shipped without a submission. Same gate
  # as `attach`, and it runs after it, so the store is only pointed at a tag
  # whose installers are already on the release. omapak-submit re-checks the
  # tag shape and refuses prereleases itself, so an RC coming through
  # release.yml cannot move the pin.
  omapak:
    name: submit to omapak
    needs: [resolve, attach]
    if: needs.resolve.outputs.release_tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/omapak-submit.yml
    with:
      tag: ${{ needs.resolve.outputs.release_tag }}
    secrets: inherit
