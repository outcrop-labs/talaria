# Talaria CI — the invariant tripwire, the unit tests, the typecheck, and the
# builds a release stands on.
#
# WHAT THIS DOES
#   On every pull request, every push to testing, rc or main, every push to
#   ci/<branch> (through ci-offload.yml), testing's daily full battery
#   (promote-testing.yml), and before every publish (release.yml):
#     bun run check                             (invariants, doc links, generated
#                                               references; no install)
#     cd ui && test + typecheck + build         (vitest, svelte-check, the prod
#                                               bundles and their smoke)
#     cd mcp && typecheck + build
#     cd cli && typecheck + bun test            (the `talaria` CLI)
#     cd api && fmt + clippy + cargo test       (the Rust port, and its
#                                               live-database suite)
#     the migration array: replay + upgrade     (scratch postgres)
#     docker build of the app image             (the root Dockerfile, no push)
#     cd desktop && fmt + clippy + cargo test + svelte-check  (the desktop shell)
#     cd desktop/src-tauri && clippy + cargo test on macOS and Windows  (their own code)
#     the desktop connect smoke on Linux, macOS and Windows  (does it open an instance)
#     cd mobile && the Android tests + assemble, and the iOS compile + link
#     the MCP end-to-end suite (Playwright against a booted app + api + stubs)
#   Every job but the invariants runs only when its surface moved; the `what
#   changed` job decides, by running scripts/surfaces.mjs.
#
# MODES. scripts/surfaces.mjs picks one per run, with the diff range; its
#   header is the full table, and docs/BRANCHES.md → CI modes is the policy.
#     light        a pull request into testing (or into anything but rc or
#                  main), a push to ci/<branch> (the offload lane), any other
#                  push. The surfaces the diff moved, Linux only: macOS,
#                  Windows, iOS and e2e are skipped.
#     integration  a push to testing. The Linux surfaces since testing's last
#                  green push run; the api workspace-wide.
#     full         a pull request into rc, one into main that promotion mode
#                  does not take, a push to rc or main, release.yml's call,
#                  testing's daily battery, a push to ci/full/<branch>, and the
#                  offload of a hotfix/, release/, sync/, promote/ or backflow/
#                  branch. Every job its surface asks for, the platform legs
#                  included.
#     promotion    the rc → main pull request, when its head is this
#                  repository's rc and the merge ref's tree is rc's tip tree.
#                  Every surface is off, so `what changed` and the invariants
#                  are all that run: the tree is the one rc's push CI checked
#                  and rc-deploy deployed, and `promotion gate (rc verified)`,
#                  required on main, reads exactly those runs. A fork's rc, or
#                  a merge tree that differs, is full, and the run's summary
#                  says why.
#   The platform legs test `!= light && != integration`, never `== full`, so a
#   mode this file does not know runs them wherever their surface is on. A
#   pull request is planned by its BASE's copy of the planner: a new mode
#   reaches a branch's pull requests once the planner is on that branch. The
#   long-lived branches check everything since their own last GREEN push run,
#   so a push whose run was cancelled or went red is covered by the next one.
#
# REQUIRED CONTEXTS. Job names are contexts — never rename one. The rulesets
#   (docs/BRANCHES.md → The required settings) match a job's `name:` string,
#   so a renamed job leaves the old context pending for ever and the new one
#   unrequired. Each row is a context and the rulesets that require it
#   (testing-checks, rc-checks, main-checks); scripts/surfaces.test.mjs holds
#   the table to those rulesets and to the job names here and in flow.yml:
#
#     what changed                                      testing rc main
#     invariants (no deps)                              testing rc main
#     test + typecheck (ui)                             testing rc
#     typecheck + build (mcp)                           testing rc
#     typecheck + test (cli)                            testing rc
#     fmt + clippy + test (api)                         testing rc
#     migrations (replay + upgrade)                     testing rc
#     app image builds (docker)                         testing rc
#     fmt + clippy + test + typecheck (desktop)         testing rc
#     test + assemble (mobile)                          testing rc
#     clippy + test + connect smoke (desktop macos)     rc
#     clippy + test + connect smoke (desktop windows)   rc
#     compile + link (mobile ios)                       rc
#     mcp end-to-end (playwright)                       rc
#     pr target (flow)                                  testing rc main
#     promotion gate (rc verified)                      main
#
#   The last two are flow.yml's. A job skipped by its job-level `if` reports
#   success, so a surface that did not move satisfies its context (the
#   `paths:` note below). Called from another workflow, the same jobs report as
#   `<caller job> / <name>` (`offload / …`, `ci / …`), which is why an offload
#   or a release run can never satisfy, or shadow, a required context.
#
# WHY THIS FILE IS CALLABLE (workflow_call). `release.yml` runs these exact
#   jobs before every publish, passing the ref it is about to build (a
#   `schedule` event's own ref is the DEFAULT branch, not the branch being
#   built — so the ref must be handed in explicitly). The call is the only
#   way "what gates a publish" and "what gates a PR" stay the same list; a
#   copy of these jobs in release.yml would drift the first time someone
#   edited one file and not the other, and a publish gate that is weaker
#   than the PR gate is a decision nobody made. ci-offload.yml and
#   promote-testing.yml's daily battery call it the same way, with a `mode`.
#
# EVERY CALLER GRANTS actions: read. The changes job asks for it (the
#   planner's last-green-run lookup), and a nested job cannot exceed its
#   caller. A caller that grants less is a startup failure: the run dies
#   before any job, as the Sep 2–16 nightlies did unnoticed.
#   check-invariants.mjs (`ci-call-grants`) holds every caller to it.
#
# THE CHECKOUT REF is `${{ inputs.ref }}` in every job, and nothing else. Empty
#   (a standalone run) means actions/checkout takes the event's own sha.
#   `github.ref` would be re-resolved BY NAME at checkout time, and for a pull
#   request that is refs/pull/N/merge, which GitHub may have rebuilt since the
#   event: run 42772152940 checked out a different merge commit than its event
#   described, lost its diff and ran everything on a changelog-only PR.
#
# WHY IT IS THIS SHORT. It is a TRIPWIRE, not a pipeline. Every PR-numbered
#   commit in this repo's history merged with nothing automated having run on
#   it; the point is to close that, cheaply enough that nobody is tempted to
#   skip it. A slow required check gets bypassed, and a bypassed check is worse
#   than none because it reads as coverage.
#
# WHY BUN *AND* NODE ARE BOTH INSTALLED. Bun is the repo's runner and installer
#   (root package.json, `bun talaria …`), so CI installs and
#   drives everything through it — the same commands a developer runs. But the
#   toolchain binaries (vite, vitest, svelte-check, tsc) carry `env node`
#   shebangs, and `bun run <script>` executes those under Node. Dropping
#   setup-node would work right up to the first `vitest` invocation and then
#   fail with a shebang error nobody enjoys diagnosing. Bun orchestrates;
#   Node executes the tools; both floors are load-bearing.
#
# WHY `bun run typecheck` AND NOT `tsc --noEmit`. They are not the same
#   check any more and the difference is 384 files. The UI is Svelte 5 +
#   sv-router; `tsc` does not read `.svelte` at all, so a component with a
#   broken prop type, a missing import or a bad `$derived` typechecks perfectly
#   under `tsc` and fails under `svelte-check`. The script in ui/package.json is
#   the one source of truth for what "typechecked" means here — CI runs the same
#   command a developer runs, so the two can never disagree about the flags.
#   `svelte-check` exits 0 on warnings and non-zero on errors, which is the
#   behavior this job wants: 127 pre-existing a11y warnings must not fail the
#   build, and one new type error must.
#
# WHY THE TESTS ARE NOT A LIST. `bun run test` runs vitest, which DISCOVERS
#   `src/**/*.test.ts` rather than being handed a list, so a new test file gates
#   on the next push without anyone remembering to register it.
#
# NO ACTIONS/CACHE, on purpose. Bun's cold install from bun.lock is cheap, and
#   a cache step would add config surface to save less than the tripwire
#   philosophy is willing to spend. The rust-cache steps (api, desktop, e2e)
#   are the exception and carry their own notes — the tradeoff is inverted for
#   cargo. The image job keeps no layer cache either: what it proves is that the
#   context builds from nothing, the way rc-deploy and release.yml build it.
#
# DELIBERATELY LEFT OUT (do not treat these as oversights)
#   - THE MODEL FITNESS SUITE (ui/src/server/fitness/*). It costs money and
#     needs a live model, and its answer is a property of the model rather than
#     of the commit — a run that fails because a provider is rate-limiting is a
#     red build nobody can fix by editing code. It is an admin-initiated sweep
#     from Admin → Models, and it stays one. Its SCORERS are pure and are
#     covered by the ordinary unit tests above, which is the part a commit can
#     actually break.
#   - Lint / format. A separate decision with its own rollout cost: a linter
#     added against an unlinted codebase produces hundreds of failures and then
#     gets disabled. Not this file's problem.
#   - Any deploy, and any push. The ui job builds the prod bundles and the
#     image job builds the app image, and both are thrown away:
#     testing-deploy.yml and rc-deploy.yml deploy, and release.yml and
#     app-image.yml publish.
#   - Typechecking `scripts/`. It is EXECUTED instead, by the invariants job.
#   - `paths:` filters ON THE TRIGGERS. Still out, and now for a reason that
#     survives contact: a workflow-level filter is as coarse as the whole file,
#     and one of these jobs — invariants, no install — has to see
#     EVERY push, including the docs-only ones it is cheapest on (that is where
#     a broken link lives). The old objection stands too: a filtered-out checks
#     run that a branch protection rule requires reports "pending" forever and
#     blocks the merge. What this file does instead is decide per job, inside
#     the run, in the `changes` job below — same grain as the jobs, and a job
#     skipped by a job-level `if` counts as a SUCCESSFUL required check, so a
#     skipped surface cannot wedge a merge either (GitHub's documented behavior
#     for skipped jobs; it is the workflow-level filter that reports nothing at
#     all). These jobs are required checks on testing, rc and main (REQUIRED
#     CONTEXTS above) — which is exactly why there is no `paths:` filter on
#     this file's triggers.
#
# THE INVARIANTS JOB, and why a typechecker cannot replace it. `tsc` cannot see
#   the failure this repo actually keeps having. Seven consecutive review rounds
#   found the same shape of bug — a predicate that decides whether an AGENT may
#   write to a ticket, or which statuses are terminal, written out by hand at a
#   new call site instead of imported — and every one of those copies typechecked
#   perfectly, because a copy of a correct expression is a correct expression
#   until the original changes. `scripts/check-invariants.mjs` fails on the
#   specific patterns that history says are wrong and prints what to write
#   instead. It is plain script with ZERO dependencies, so this job needs no
#   install step — which is also why it is not eslint.
#   The rules live in that file, commented; amend them there, not here.
#
#   VERIFIED, not assumed: each rule was re-introduced as a deliberate violation
#   against a throwaway copy of the tree and each one failed the run, naming the
#   file, the line and the fix. So were the three checks that guard the rules
#   themselves (a renamed canonical definition, two cross-checked lists made to
#   disagree, a censused occurrence fixed without lowering the count), which
#   matter more than the rules do — a duplicate-definition rule whose subject no
#   longer exists passes forever.
#
# NOTES FOR WHOEVER TOUCHES THIS NEXT
#   - The Bun, Node and Rust versions are pinned ONCE, in
#     `.github/actions/setup-runtime/action.yml` — which is why
#     `.github/actions/**` is in every `surface` list below. Move them THERE,
#     and also:
#       - Bun's other home is the root package.json's `packageManager` field.
#       - Rust's other homes are api/rust-toolchain.toml and
#         desktop/src-tauri/rust-toolchain.toml (the source of truth — cargo
#         honors them everywhere) and the rustup line in
#         docker/devbox.Dockerfile. sqlx 0.9's MSRV is the floor; pinning
#         rather than tracking stable is what keeps devbox/CI/host one
#         toolchain.
#       - Node 22 is a hard floor, not a preference: vite 7 declares
#         `^20.19.0 || >=22.12.0`. If you add a .nvmrc at the repo root, switch
#         the action's node step to `node-version-file:` so there is one source
#         of truth.
#   - `bun install --frozen-lockfile` makes bun.lock authoritative: a drifting
#     ui/package.json fails here instead of silently resolving to something
#     else. package-lock.json is ALSO committed, for the npm holdouts during
#     the migration — treat bun.lock as canonical and update both when deps
#     change (or, post-alpha, delete the npm one and this note).
#   - `ui/tsconfig.json` includes `../apps`, so this needs a full-repo checkout,
#     not a sparse one. Installed apps under `apps/` are Svelte and are checked
#     by the ui typecheck job, not by a job of their own.
#   - There is no committed route codegen to run: sv-router resolves
#     `src/routes/**` at build time from the files themselves.


name: CI

on:
  pull_request:
  push:
    # The long-lived branches. Each checks everything since its own last green
    # push run (scripts/surfaces.mjs), so a cancelled or red run is covered by
    # the next one. testing, the integration lane, runs integration mode; rc
    # and main run full. rc is what nightly and the RC channel are built from —
    # a broken tip has to fail HERE, on the push that created it, rather than
    # at 03:17 in a nightly publish with nobody watching. main takes the
    # promotion merge, and nothing else. ci/** pushes are NOT here:
    # ci-offload.yml calls this file for them, so their checks carry its
    # prefix. docs/BRANCHES.md is the model.
    branches: [main, rc, testing]
  # release.yml and ci-offload.yml call this file (see their headers), so a
  # publish and an offload are gated by exactly what gates a PR. The ref MUST
  # be explicit when called: a schedule event's github.ref is the default
  # branch, not the branch being built.
  workflow_call:
    inputs:
      ref:
        description: 'ref to check out (empty means the sha of the triggering event)'
        type: string
        required: false
      mode:
        description: 'light | full | integration; empty with a ref means release.yml: every surface, full'
        type: string
        required: false
        default: ''

# Long-lived refs QUEUE: one run in progress, the newest push pending behind
# it, so the tip always gets a completed run (and the next push's range starts
# from the last green one, which a cancelled run would never be). PR and
# offload refs cancel a superseded run: nobody waits on results for a commit
# they already replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/testing","refs/heads/rc","refs/heads/main"]'), github.ref) }}

permissions:
  contents: read

jobs:
  # WHAT THIS RUN ACTUALLY HAS TO CHECK. One cheap job decides, and every heavy
  # job consults it: a UI change does not re-run the Rust api's fmt+clippy+test,
  # a desktop change does not re-run the UI suite, and a docs-only push runs the
  # invariants job and nothing else. The surfaces are the paths whose change can
  # break that job, and nothing wider. The lists, the mode and the diff range
  # all come from scripts/surfaces.mjs (the local gate imports the same lists);
  # the rationale for every glob is written above SURFACES there.
  #
  # WHY NOT `paths:` ON THE TRIGGERS (which the header still rules out). This is
  # ONE workflow with several unrelated jobs, so a workflow-level filter can
  # only be as coarse as the whole file — and the invariants job, which needs
  # no install, is meant to run on every push, because doc
  # links and the rule patterns are exactly what a "docs-only" change touches.
  # Deciding per job inside the run keeps that grain and leaves the cheap check
  # unconditional.
  #
  # A job whose surface did not move is SKIPPED, and that is honest rather than
  # quiet: these jobs ARE required checks (the header's REQUIRED CONTEXTS), and
  # a job skipped by a job-level `if` is reported as a success (GitHub's
  # documented behavior), so a skipped surface satisfies its check instead of
  # wedging the merge the way a workflow-level `paths:` filter would. That is
  # also all promotion mode is: every surface false, every surface job skipped.
  # The header's MODES and docs/BRANCHES.md carry the rest.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read is the planner's lookup of the branch's last green run
    # (rc, main, testing). Every workflow that calls this file must grant it
    # too — see the header's EVERY CALLER GRANTS actions: read.
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      range: ${{ steps.plan.outputs.range }}
      ui: ${{ steps.plan.outputs.ui }}
      mcp: ${{ steps.plan.outputs.mcp }}
      cli: ${{ steps.plan.outputs.cli }}
      api: ${{ steps.plan.outputs.api }}
      desktop: ${{ steps.plan.outputs.desktop }}
      mobile: ${{ steps.plan.outputs.mobile }}
      e2e: ${{ steps.plan.outputs.e2e }}
      db: ${{ steps.plan.outputs.db }}
      image: ${{ steps.plan.outputs.image }}
      # The api job's plan (scripts/surfaces.mjs, API_KEYS) and the array the
      # migrations job upgrades from.
      api_scope: ${{ steps.plan.outputs.api_scope }}
      api_packages: ${{ steps.plan.outputs.api_packages }}
      api_lib_packages: ${{ steps.plan.outputs.api_lib_packages }}
      api_it: ${{ steps.plan.outputs.api_it }}
      api_it_modules: ${{ steps.plan.outputs.api_it_modules }}
      api_live: ${{ steps.plan.outputs.api_live }}
      api_bin: ${{ steps.plan.outputs.api_bin }}
      migration_baseline: ${{ steps.plan.outputs.migration_baseline }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # The diff needs the base commit; a shallow clone does not have it.
          fetch-depth: 0

      # The bases the planner diffs against (origin/main for a push to rc,
      # origin/rc for testing, the nearer of testing and rc for a light run).
      # main and rc must exist; testing may not.
      - name: Fetch the long-lived branches
        run: |
          set -eu
          git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/rc:refs/remotes/origin/rc'
          git fetch --no-tags --quiet origin '+refs/heads/testing:refs/remotes/origin/testing' || echo 'no testing branch'

      # A pull request is planned by the BASE's copy of the planner, so a PR
      # cannot narrow its own CI by editing scripts/surfaces.mjs — and an edit
      # to the planner is in every surface anyway, so the PR that carries one
      # runs everything. Every other event (a push, a call) runs the copy in
      # its own checkout: that commit is already on a branch someone merged.
      - name: Materialize the planner
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ] && git cat-file -e "$BASE_SHA:scripts/surfaces.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/surfaces.mjs" > "$RUNNER_TEMP/surfaces.mjs"
            echo "planner: the base's copy ($BASE_SHA)"
          else
            cp scripts/surfaces.mjs "$RUNNER_TEMP/surfaces.mjs"
            echo "planner: this checkout's copy"
          fi

      # The plan goes to a scratch file first, and the next step copies it
      # into the job's outputs.
      - name: Plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # Same repository or a fork: only a same-repo PR uploads the api
          # binary, and only this repository's rc (HEAD_REPO == REPO) can be a
          # promotion.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CALLED_REF: ${{ inputs.ref }}
          CALLED_MODE: ${{ inputs.mode }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DELETED: ${{ github.event.deleted }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_OUTPUT="$RUNNER_TEMP/plan.out" node "$RUNNER_TEMP/surfaces.mjs" ci

      # FAIL CLOSED: an older planner copy (main's ci.yml, or a PR base's)
      # that lacks a newer key runs more, never less. A missing mode is full;
      # a missing or garbled surface is true (a planner older than the image
      # job emits no `image`, so it builds). A missing api plan is the
      # workspace with every live module; a missing binary flag builds the
      # binary where a planner would (a same-repo pull request, a push to
      # testing, an offload); a missing baseline is the pull request's base,
      # else origin/main.
      - name: Normalize the plan (fail closed)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          CALLED_MODE: ${{ inputs.mode }}
        run: |
          set -eu
          out="$RUNNER_TEMP/plan.out"
          touch "$out"
          get() { sed -n "s/^$1=//p" "$out" | tail -n 1; }
          mode=$(get mode)
          if [ -z "$mode" ]; then
            echo "::warning::the planner emitted no mode, so this run is full"
            mode=full
          fi
          {
            echo "mode=$mode"
            echo "base=$(get base)"
            echo "range=$(get range)"
            echo "reason=$(get reason)"
          } >> "$GITHUB_OUTPUT"
          for key in ui mcp cli api desktop mobile e2e db image; do
            value=$(get "$key")
            case "$value" in
              true|false) ;;
              *)
                echo "::warning::the planner emitted no usable $key, so it runs"
                value=true ;;
            esac
            echo "$key=$value" >> "$GITHUB_OUTPUT"
            echo "  $key: $value"
          done

          # The api plan. Package names and module stems are plain words, or
          # the plan is unreadable and the workspace runs.
          scope=$(get api_scope)
          pkgs=$(get api_packages)
          libpkgs=$(get api_lib_packages)
          it=$(get api_it)
          modules=$(get api_it_modules)
          live=$(get api_live)
          bin=$(get api_bin)
          words='^[A-Za-z0-9_ -]*$'
          if [ "$scope" = packages ] && printf '%s\n' "$pkgs" | grep -qE "$words" && printf '%s\n' "$libpkgs" | grep -qE "$words" \
            && printf '%s\n' "$modules" | grep -qE '^([*]|[A-Za-z0-9_ ]*)$'; then
            case "$it" in true|false) ;; *) it=true; modules='*' ;; esac
            case "$live" in true|false) ;; *) live=true ;; esac
            if [ "$it" = true ]; then
              live=true
              [ -n "$modules" ] || modules='*'
            fi
          else
            [ "$scope" = workspace ] || echo "::warning::the planner emitted no usable api plan, so the api job tests the workspace"
            scope=workspace; pkgs=''; libpkgs=''; it=true; modules='*'; live=true
          fi
          case "$bin" in
            true|false) ;;
            *)
              bin=false
              case "$EVENT" in
                pull_request) [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$REPO" ] || bin=true ;;
                push) [ "$REF" != refs/heads/testing ] || bin=true ;;
              esac
              case "$REF:$CALLED_MODE" in refs/heads/ci/*:light|refs/heads/ci/*:full) bin=true ;; esac ;;
          esac
          baseline=$(get migration_baseline)
          if ! printf '%s\n' "$baseline" | grep -qE '^origin/[A-Za-z0-9._/-]+$'; then
            baseline=origin/main
            if [ "$EVENT" = pull_request ] && printf '%s\n' "$BASE_REF" | grep -qE '^[A-Za-z0-9._/-]+$'; then
              baseline="origin/$BASE_REF"
            fi
          fi
          {
            echo "api_scope=$scope"
            echo "api_packages=$pkgs"
            echo "api_lib_packages=$libpkgs"
            echo "api_it=$it"
            echo "api_it_modules=$modules"
            echo "api_live=$live"
            echo "api_bin=$bin"
            echo "migration_baseline=$baseline"
          } >> "$GITHUB_OUTPUT"
          echo "  api: scope=$scope packages=[${pkgs}] it=$it modules=[${modules}] live=$live bin=$bin"
          echo "  migration baseline: $baseline"
          echo "plan: mode=$mode range=$(get range)"

  # Deliberately FIRST and deliberately dependency-free: it needs no install,
  # so it reports in well under a minute and a PR that re-introduces a known bug
  # learns that before the other jobs have finished installing.
  invariants:
    name: invariants (no deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          # Empty when run standalone: the event's own sha (the header's THE
          # CHECKOUT REF). The called ref (rc, a tag, an offload sha) when
          # release.yml or ci-offload.yml drives this file.
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          # Bun only: this job installs nothing, and neither toolchain below
          # is used here.
          node: ''
          rust: ''

      # Reads ui/src and mcp/src. Every failure names the file, the line, and
      # the thing to write instead; if you think a match is a false positive,
      # argue it in the PR rather than widening the pattern.
      - name: Check invariants + docs
        # `bun run check` — the full gate chain (invariants, doc links, generated
        # references). Calling a script directly here would silently skip every
        # gate added to the chain after this line was written.
        run: bun run check

  ui:
    name: test + typecheck (ui)
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # Bun installs and drives, Node executes the toolchain shebangs (see
      # "WHY BUN *AND* NODE" in the header); no Rust in this job. The install's
      # `--frozen-lockfile` makes bun.lock authoritative.
      - uses: ./.github/actions/setup-runtime
        with:
          rust: ''
          install-dir: ui

      # TESTS FIRST, and the order is a decision rather than a coin toss. The
      # unit suite runs in seconds and its failures name a behavior ("the runner
      # repairs once and no more"); svelte-check takes a minute or two and its
      # failures name a type. When both are broken the behavioral failure is the
      # one worth reading first.
      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      # The prod bundles are what ships — test + typecheck never execute
      # them. Build for real and smoke the BUILT fetch handler: GET / must
      # serve the SPA shell (2026-09-17: a vite output change moved the
      # handler into dist/server/assets/*.js, one directory deeper than the
      # shell lookup was anchored to, and every page on every instance
      # 404'd while dev mode, unit tests, and typecheck were all green —
      # nothing ran the built bundle).
      - name: Build (prod bundles)
        run: bun run build

      - name: Prod smoke (SPA shell from the built bundle)
        run: bun scripts/check-prod-shell.ts

  mcp:
    name: typecheck + build (mcp)
    needs: [changes]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          rust: ''
          install-dir: mcp

      - name: Typecheck
        run: bun run typecheck

      # Emit for real. `--noEmit` above proves the types; this proves the thing
      # `talaria dev`/`setup` actually run can produce mcp/dist/index.js, which is
      # what the app spawns (`ui/src/server/mcp-service.ts`). The artifact is
      # thrown away — CI does not ship dist.
      - name: Build
        run: bun run build

      - name: Verify build output
        run: test -s dist/index.js

  # The `talaria` CLI is executable product now, not a script — it gets the
  # same tripwire treatment. bun:test only (no node needed for the TESTS), but
  # tsc carries a node shebang like every other toolchain binary, so node is
  # installed for the typecheck step. No build: the bin runs as TypeScript
  # under bun, which IS the product's execution path.
  cli:
    name: typecheck + test (cli)
    needs: [changes]
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          rust: ''
          install-dir: cli

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # The Rust port of the API (docs/RUST-MIGRATION.md) — the same tripwire
  # treatment for api/ that the jobs above give ui/, mcp/ and cli/: fmt, clippy
  # and the tests (`bun run api:check` from the root runs the first three),
  # then the live-database suite against a scratch postgres and redis.
  #
  # WHY THE LIVE SUITE RIDES HERE. It used to be api-integration.yml, its own
  # workflow, and that cost twice. It recompiled the same lib-test binaries this
  # job had just built — 249 of them, 11 of its 22.7 minutes, to run 86 tests —
  # and a workflow filtered by `paths:` can never be a required check (one that
  # never starts reports nothing, and protection reads that as pending for
  # ever), so the window's best real-bug catcher (runs_store's compare-and-set,
  # four times; design_live, brief_verdict, the TALA-90 bootstrap) stayed
  # advisory. Here the live steps reuse this job's build, and the job is
  # required. A publish runs it too: release.yml calls this file in full mode.
  #
  # THE SCOPE (scripts/surfaces.mjs, planApi). Integration and full runs test
  # the workspace and run every live module. A light run tests the packages its
  # diff touches, and only the api/tests/it modules that reach them; postgres
  # and redis start only when a live test is in scope. Clippy runs the same in
  # every mode, and the root package depends on every crate, so it checks
  # every crate's library: one that stops compiling against a dependency's
  # change is red here even when its tests are not in scope. (A crate's own
  # test code is compiled only when its tests are.)
  #
  # NO RECOMPILE BETWEEN STEPS. Every cargo invocation below selects the SAME
  # packages ($API_SEL): cargo resolves features per selection, and a
  # dev-dependency's features (tokio's test-util, for one) are on only when the
  # selection's tests are built. A different `-p` list, or a `cargo build` after
  # `cargo test`, resolves them differently and rebuilds tokio and every crate
  # above it.
  api:
    name: fmt + clippy + test (api)
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # 45, not the tripwire 15: the workspace split multiplied test binaries
    # (one per crate where the monolith built a handful), and a COLD run —
    # first push of a lockfile change — links ~200 of them after clippy's
    # check-only artifacts prove unusable for cargo test; the live suite then
    # runs on top. rust-cache makes every rerun after the first minutes; the
    # timeout has to fit the cold one or the cache never gets written.
    timeout-minutes: 45

    defaults:
      run:
        working-directory: api

    env:
      # Deterministic artifacts for rust-cache: incremental state is keyed on
      # local edit history, so a cached incremental dir is junk to the next
      # run. Full non-incremental units are what the cache can actually reuse.
      CARGO_INCREMENTAL: '0'
      # The plan. No database settings here: the unit suite is pure, and only
      # the live steps below are handed postgres and redis.
      MODE: ${{ needs.changes.outputs.mode }}
      SCOPE: ${{ needs.changes.outputs.api_scope }}
      PKGS: ${{ needs.changes.outputs.api_packages }}
      LIBPKGS: ${{ needs.changes.outputs.api_lib_packages }}
      MODULES: ${{ needs.changes.outputs.api_it_modules }}
      # The live steps run when the plan says so, and always outside light
      # mode: a garbled plan on an rc run must not skip the database suite.
      LIVE: ${{ needs.changes.outputs.api_live == 'true' || needs.changes.outputs.mode != 'light' }}
      IT: ${{ needs.changes.outputs.api_it == 'true' || needs.changes.outputs.mode != 'light' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # FAIL CLOSED. Anything but light tests the workspace; a scope this step
      # does not know is a red job, never a skipped test; an empty selection is
      # an answer only a light plan may give.
      - name: Scope
        run: |
          set -eu
          if [ "$MODE" != light ]; then SCOPE=workspace; fi
          case "$SCOPE" in
            workspace) sel=--workspace ;;
            packages) sel=$(for p in $PKGS; do printf -- '-p %s ' "$p"; done) ;;
            *) echo "::error::unknown api_scope '$SCOPE'"; exit 1 ;;
          esac
          if [ -z "$sel" ] && [ "$MODE" != light ]; then
            echo '::error::empty package selection outside light mode'; exit 1
          fi
          echo "API_SEL=$sel" >> "$GITHUB_ENV"
          echo "mode $MODE, scope $SCOPE: cargo test ${sel:-(no package)}; live modules: ${MODULES:-none}"

      # The live suite's containers, started before the toolchain so they boot
      # while it installs and clippy runs; the Bootstrap step waits for them.
      # The container MUST be named talaria-mig-pg: check-migrations.ts's
      # PG_DUMP default is `docker exec talaria-mig-pg pg_dump -U talaria`, so
      # the bootstrap doubles as the schema-snapshot check with no extra
      # wiring. Same image as prod sidecars. Redis on 6399, the dev port, not
      # 6379: fitness_arming and llm_models fall back to
      # redis://127.0.0.1:6399 when REDIS_URL is unset, and mapping the host
      # port to the dev number makes even those fallbacks correct.
      - name: Start scratch postgres + redis (early)
        if: env.LIVE == 'true'
        run: |
          docker run -d --name talaria-mig-pg \
            -e POSTGRES_USER=talaria -e POSTGRES_PASSWORD=talaria -e POSTGRES_DB=talaria \
            -p 127.0.0.1:55441:5432 postgres:16-alpine
          docker run -d --name talaria-ci-redis -p 127.0.0.1:6399:6379 redis:7-alpine

      # Rust: the pinned toolchain (not stable), for the reason the header's
      # NOTES give — the crate pins it in rust-toolchain.toml and devboxes
      # install the same one, so CI must not drift ahead of the environments the
      # port runs in. The action installs rustfmt + clippy, which the fmt/clippy
      # gates below need; the toolchain pin itself is honored by rustup from the
      # checked-out rust-toolchain.toml. Bun (seconds) and, only when the live
      # steps run, the ui install: the migration replay runs on its postgres
      # driver.
      - uses: ./.github/actions/setup-runtime
        with:
          node: ''
          install-dir: ${{ env.LIVE == 'true' && 'ui' || '' }}

      # The ONE actions/cache use in this file (see the header's amended "no
      # cache" note): cargo's cold build of the dependency tree is minutes on
      # every push, and rust-cache costs one line. It keys on Cargo.lock, so
      # a dependency change recompiles exactly what changed and nothing else.
      #
      # ONLY A PUSH TO A LONG-LIVED BRANCH WRITES IT. Pull request, offload
      # (ci/**), schedule and workflow_call runs restore and never write: the
      # repository's caches are 11.2 GB against GitHub's 10 GB cap, so every
      # PR-scoped save evicts a long-lived branch's cache that every PR
      # restores from. A schedule or call run's github.ref is main, so the
      # event check is what keeps those runs from writing main's scope.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          save-if: ${{ github.event_name == 'push' && contains(fromJSON('["refs/heads/main","refs/heads/rc","refs/heads/testing"]'), github.ref) }}

      # mold: api/.cargo/config.toml passes -fuse-ld=mold on gnu linux, so
      # `ld.mold` is a hard dependency of the link. The action bounds the apt
      # call and falls back to the default linker rather than hanging the job
      # on a slow mirror — which cost two blocked pull requests before it
      # existed. See .github/actions/mold/action.yml.
      - uses: ./.github/actions/mold

      # Same order as api:check: format (instant, and its failures are the
      # cheapest to read), then clippy as the port's lint gate (-D warnings —
      # the crate develops clean or not at all), then the tests.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The full TS MIGRATIONS array into the scratch postgres, so the live
      # tests meet the exact schema a deployed instance would — and the replay
      # doubles as the snapshot check. Probe TCP (-h 127.0.0.1), never the
      # socket: the image's initdb phase runs a temporary server that answers
      # socket probes before the real one listens.
      - name: Bootstrap schema (full migration replay + snapshot check)
        if: env.LIVE == 'true'
        working-directory: ui
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
          # The secretbox load demands a key; never a real one — these
          # containers die with the job.
          TALARIA_SECRET_KEY: ci-scratch-key
        run: |
          set -eu
          for i in $(seq 1 30); do
            docker exec talaria-mig-pg pg_isready -h 127.0.0.1 -U talaria -q && break
            sleep 1
          done
          docker exec talaria-mig-pg pg_isready -h 127.0.0.1 -U talaria -q \
            || { echo "postgres never became ready"; docker logs talaria-mig-pg; exit 1; }
          bun run migrations:check

      - name: Test
        # --workspace (the selection's workspace form), NOT bare `cargo test`.
        # api/Cargo.toml is a workspace root that ALSO carries a root package
        # (talaria-api) and declares no default-members, so bare `cargo test`
        # selects that one package and nothing else — three test binaries, none
        # of the ~200 under crates/. Every per-crate unit test in this tree was
        # therefore never run here.
        # --no-fail-fast because cargo stops at the first failing test BINARY,
        # and with ~200 of them one broken crate hides every crate after it
        # alphabetically. The first discovery run showed exactly that:
        # talaria-fitness failed, so talaria-harness-defs onward never ran.
        run: |
          set -eu
          read -r -a sel <<< "$API_SEL"
          if [ "${#sel[@]}" -eq 0 ]; then echo 'no package in scope'; exit 0; fi
          cargo test "${sel[@]}" --no-fail-fast --quiet

      # The #[ignore]d tests inside the crates (talaria-runs-store's, among
      # others) against the scratch database. Same selection, profile and flags
      # as Test, so nothing recompiles: these binaries are the ones Test built,
      # run again with --ignored.
      - name: Ignored in-crate tests (live DB)
        if: env.LIVE == 'true'
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
          REDIS_URL: redis://127.0.0.1:6399
          TALARIA_SECRET_KEY: ci-scratch-key
        run: |
          set -eu
          read -r -a sel <<< "$API_SEL"
          if [ "${sel[*]}" != --workspace ] && [ -z "$LIBPKGS" ]; then
            echo 'no library in scope: no ignored in-crate tests to run'; exit 0
          fi
          cargo test "${sel[@]}" --no-fail-fast --quiet --lib -- --ignored

      - name: Live integration modules (tests/it)
        if: env.IT == 'true'
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
          REDIS_URL: redis://127.0.0.1:6399
          TALARIA_SECRET_KEY: ci-scratch-key
        run: |
          set -eu
          # Every planned module of the one integration binary (api/tests/it/)
          # runs with --ignored; `*` is every module, so a new
          # tests/it/<file>.rs is picked up with no edit here. The only
          # committed knowledge is what CANNOT run here — each exclusion says
          # why, at the exclusion.
          #
          # One module per run, not the whole binary in one go: the files were
          # separate binaries until they were merged to link once, so tests
          # from different files have never shared the scratch database
          # concurrently. Test built the binary (the root package is in every
          # selection that plans a module); a plan with no package (a schema
          # change alone) builds it on the first module here. The rest only
          # filter it. A failing module does not hide the next one.
          if [ "$MODE" != light ]; then MODULES='*'; fi
          if [ "$MODULES" = '*' ]; then
            modules=$(/bin/ls tests/it/*.rs | sed 's|^tests/it/||; s|\.rs$||')
          else
            modules=$MODULES
          fi
          # The selection Test used; a plan with no package is the root
          # package's binary alone.
          read -r -a sel <<< "$API_SEL"
          [ "${#sel[@]}" -gt 0 ] || sel=(-p talaria-api)
          failed=""
          for t in $modules; do
            case "$t" in
              # typed_binds: needs the dev retrieval containers (qdrant + TEI
              # embeddings). Stays a local suite against talaria dev infra.
              typed_binds) continue ;;
              # main is the crate root that declares the modules, not a suite.
              main) continue ;;
              # update_live: reads the real ghcr.io registry — network-shaped,
              # not a per-push gate.
              update_live) continue ;;
            esac
            skips=()
            # llm_models/minted_key_lists_the_catalog wants a minted tlk_ key
            # (TALARIA_LLM_TEST_KEY) this job does not create.
            [ "$t" = "llm_models" ] && skips=(--skip llm_models::minted_key_lists_the_catalog)
            echo "== $t =="
            cargo test "${sel[@]}" --quiet --test it -- --ignored "$t::" "${skips[@]}" || failed="$failed $t"
          done
          [ -z "$failed" ] || { echo "::error::live modules failed:$failed"; exit 1; }

      # The dev binary `talaria dev --api-from-ci` runs instead of `cargo run`.
      # Test already built it: cargo builds a package's binaries for its
      # integration tests (tests/it), into target/debug/, with the selection's
      # features. A `cargo build --bin talaria-api` here would resolve features
      # without the dev-dependencies' and rebuild tokio and every crate above
      # it (the NO RECOMPILE note above), so it runs only if that binary is
      # somehow missing. rust-cache never restores it: it keeps only build/,
      # deps/ and .fingerprint/ of a profile dir.
      - name: Build the api binary for `talaria dev --api-from-ci`
        if: needs.changes.outputs.api_bin == 'true'
        run: |
          set -eu
          if [ ! -x target/debug/talaria-api ]; then
            echo "::warning::Test left no target/debug/talaria-api; building it"
            cargo build --bin talaria-api
          fi
          install -D target/debug/talaria-api "$RUNNER_TEMP/bin/talaria-api"
          strip --strip-debug "$RUNNER_TEMP/bin/talaria-api"
          ls -l "$RUNNER_TEMP/bin/talaria-api"

      - name: Upload the api binary
        if: needs.changes.outputs.api_bin == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: talaria-api-linux-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/bin/talaria-api
          retention-days: 3
          if-no-files-found: error

  # The migration array (ui/src/server/db/pg.ts), replayed. Formerly
  # migrations.yml, which a `paths:` filter kept off the required list; as a job
  # here it skips per job like the others (the planner's `db` surface), so it
  # can be required.
  #
  # WHAT THIS DOES
  #   - boots a scratch postgres:16-alpine (the exact image prod sidecars run)
  #   - replays the ENTIRE MIGRATIONS array against it from zero — proving a
  #     fresh database reaches the full schema, and that no statement in the
  #     array has a syntax error or bad column reference
  #   - runs the pass a second time and requires `applied: 0` (exactly-once,
  #     the same property boot relies on after a crash mid-pass)
  #   - replays the UPGRADE path too: the baseline's array into a second
  #     scratch postgres, then this tree's array on top of it — a mid-array
  #     insert or in-place edit trips the append-only checksum guard there,
  #     exactly where a deployed instance would trip it at boot. The baseline
  #     is the branch the change lands on (surfaces.mjs, migrationBaseline).
  #   - refuses a hotfix/* pull request that appends a migration
  #   - pg_dump --schema-only inside that container and diffs it against the
  #     committed ui/src/server/db/schema.snapshot.sql — drift fails with the
  #     regen command, so every schema-touching PR carries the real schema
  #     diff as its review artifact
  #   - runs ui/scripts/check-git-hosts-mirror.sql on both databases: the
  #     compensating git-hosts statements (#651) DO what they say, not only
  #     apply — the defaults land, the copy-back holds what the baseline had,
  #     and both mirror triggers fire in each direction
  #
  # WHY `docker run` INSTEAD OF jobs.services. The same container that serves
  #   the replay also runs pg_dump, so the dump tool can never skew from the
  #   server version — and readiness is pg_isready-polled by us, not raced by
  #   the runner. Prod is postgres:16-alpine; so is this.
  #
  # The migration RULES (the array's append-only shape, the
  # destructive-statement marking, the baseline guard; check-invariants.mjs)
  # run on every push through `bun run check` in the invariants job, api/...
  # changes included: the api does not own the migrations (api/src/db.rs says
  # so) and cannot touch them.
  migrations:
    name: migrations (replay + upgrade)
    needs: [changes]
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholders in main's github_config shape, never a real token: the
      # upgrade pass seeds it, and the mirror check holds the result to it.
      GITHUB_CONFIG_SEED: '{"mode": "app", "pat": {"tokenEnc": null}, "app": {"appId": "123456", "installationIds": ["7890"], "privateKeyEnc": "v1:ci-placeholder-sealed-key"}, "repoCreationOrgs": ["ci-org"]}'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          # Bun only; the ui install is the workspace the replay runs in.
          node: ''
          rust: ''
          install-dir: ui

      - name: Start scratch postgres 16
        run: |
          docker run -d --name talaria-mig-pg \
            -e POSTGRES_USER=talaria -e POSTGRES_PASSWORD=talaria -e POSTGRES_DB=talaria \
            -p 127.0.0.1:55441:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec talaria-mig-pg pg_isready -h 127.0.0.1 -U talaria -q && echo "postgres ready" && exit 0
            sleep 1
          done
          echo "postgres never became ready"; docker logs talaria-mig-pg; exit 1

      - name: Replay the full migration array
        working-directory: ui
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
          # The pass ends by loading the secretbox, which demands a key even
          # on a schema-only replay. Never a real one — this database dies
          # with the job.
          TALARIA_SECRET_KEY: ci-scratch-key
        run: bun run migrations:check

      # The fresh replay above proves the array runs on a virgin database —
      # which is exactly why it cannot catch a mid-array insert: a fresh
      # database has no ledger, so the append-only guard never fires. Deployed
      # instances DO. (2026-09-18: #394's workchains statements landed
      # mid-array; CI was green, and the first fleet roll refused to boot with
      # "migration 338 changed after it was applied".) This pass is that
      # upgrade, replayed: apply the baseline's array to a second scratch
      # database, then this tree's array against the SAME database — the
      # checksum guard, the appended statements, and the snapshot all have to
      # hold on a database that already has the baseline's ledger, or the PR
      # is red.
      #
      # THE BASELINE is the branch the change lands on, from the plan: a pull
      # request into testing extends testing's array (what the testing
      # instance applied); a promotion or a hotfix into rc extends rc's; a push
      # to testing extends rc's, and a push to rc or main extends main's. It
      # was origin/main for every run while pull requests went straight to rc.
      # The repair that introduced this check (#398) pinned e9f08476 instead —
      # main's tip then carried the mid-array insert no deployed database ever
      # applied (the boot guard refused fleet-wide), so the last array any
      # instance actually ran was the honest baseline. Pin a sha with
      # MIGRATION_BASELINE ONLY for that kind of transition, and flip back in
      # the very next migrations PR: a stale baseline weakens the guard to
      # inserts above the pinned prefix.
      - name: Upgrade pass — baseline migrations into a second scratch postgres
        env:
          BASELINE: ${{ needs.changes.outputs.migration_baseline }}
        run: |
          set -eu
          b=${BASELINE#origin/}
          git fetch --no-tags --depth=1 origin "$b"
          base="${MIGRATION_BASELINE:-$BASELINE}"
          echo "upgrade baseline: $base"
          # A pinned baseline sha (set via env above) is an ancestor the
          # depth-1 fetch does not carry — fetch it by sha (GitHub allows
          # want-by-sha) and fail loud rather than silently comparing
          # against the wrong array.
          if ! git cat-file -e "$base" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          git show "$base":ui/src/server/db/pg.ts > ui/src/server/db/pg.main-upgrade.ts
          docker run -d --name talaria-mig-pg-up \
            -e POSTGRES_USER=talaria -e POSTGRES_PASSWORD=talaria -e POSTGRES_DB=talaria \
            -p 127.0.0.1:55442:5432 postgres:16-alpine
          # Probe TCP (-h 127.0.0.1), never the unix socket: the image's
          # initdb phase runs a TEMP server that answers socket probes but
          # has listen_addresses='' — a socket-ready check passes seconds
          # before the real server exists, and the next step's first
          # connection dies with ECONNRESET (seen on the first run of this
          # step; the first container above only dodged it because bun
          # install sat between start and first query).
          for i in $(seq 1 30); do
            docker exec talaria-mig-pg-up pg_isready -h 127.0.0.1 -U talaria -q && break
            sleep 1
          done
          docker exec talaria-mig-pg-up pg_isready -h 127.0.0.1 -U talaria -q \
            || { echo "postgres never became ready"; docker logs talaria-mig-pg-up; exit 1; }

      - name: Upgrade pass — this tree's array on top of the baseline's ledger
        working-directory: ui
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55442/talaria
          TALARIA_SECRET_KEY: ci-scratch-key
          # The snapshot diff must come from THIS database — the upgraded
          # schema has to land where the fresh replay lands.
          PG_DUMP: docker exec talaria-mig-pg-up pg_dump -U talaria
        run: |
          set -o pipefail
          bun run migrate-file src/server/db/pg.main-upgrade.ts
          rm src/server/db/pg.main-upgrade.ts
          # A connected GitHub on the baseline, in the shape main's
          # set_github_config writes it, so the upgrade has a real config to
          # move into the `github` row and copy back (the mirror check below).
          # (stdin, not -c: psql does not interpolate :'seed' into a -c string)
          echo "insert into app_settings (key, value) values ('github_config', :'seed'::jsonb)
                on conflict (key) do update set value = excluded.value, updated_at = now();" \
            | docker exec -i talaria-mig-pg-up psql -U talaria -d talaria -v ON_ERROR_STOP=1 -v "seed=$GITHUB_CONFIG_SEED"
          # What this tree's array applied on top of the baseline's ledger:
          # the hotfix check below reads it.
          bun run migrations:check | tee "$RUNNER_TEMP/upgrade-apply.out"

      # A hotfix lands in rc and flows back into testing, and testing's array
      # (and the testing instance) is ahead of rc's: a statement a hotfix
      # appended would land at one index on rc and another on testing, and the
      # back-flow would trip the checksum guard on every instance that has
      # both. So a hotfix carries code, never a migration — the step above
      # applied this tree's array on rc's ledger, and it must have applied
      # nothing. github.head_ref is empty outside a pull request, so an
      # offload of a hotfix/ branch skips this; its pull request into rc is
      # where it gates.
      - name: Hotfixes add no migrations
        if: startsWith(github.head_ref, 'hotfix/')
        run: |
          out="$RUNNER_TEMP/upgrade-apply.out"
          if ! grep -q 'applied: 0' "$out"; then
            sed -n 's/^\[migrations\] //p' "$out"
            echo "::error::a hotfix may not add migrations (rules: docs/BRANCHES.md)"
            exit 1
          fi
          echo "the hotfix appends no migration"

      # The compensating git-hosts statements (#651, pg.ts "The git-hosts move,
      # made roll-safe") exist for what the previous release does on this
      # schema, and the snapshot only pins their text. This runs them: the
      # host_id defaults, the setting folded back from the row, and both
      # triggers in each direction, inside a transaction it rolls back. On the
      # upgraded database it also requires the baseline's GitHub config to
      # come through the move and back unchanged. Delete it with the contract
      # release that drops the mirrors (the file's header).
      - name: The git-hosts mirror holds, fresh and upgraded
        run: |
          set -eu
          echo "fresh replay:"
          docker exec -i talaria-mig-pg psql -U talaria -d talaria -v ON_ERROR_STOP=1 -q \
            < ui/scripts/check-git-hosts-mirror.sql
          echo "upgrade from the baseline, which had GitHub connected:"
          docker exec -i talaria-mig-pg-up psql -U talaria -d talaria -v ON_ERROR_STOP=1 -q -v "seeded=$GITHUB_CONFIG_SEED" \
            < ui/scripts/check-git-hosts-mirror.sql

      - name: Replay again — nothing new may apply
        working-directory: ui
        env:
          DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
          TALARIA_SECRET_KEY: ci-scratch-key
        run: |
          out=$(bun run migrations:check)
          echo "$out"
          grep -q 'applied: 0' <<<"$out"

  # THE APP IMAGE, BUILT. The root Dockerfile over the context .dockerignore
  # leaves, exactly as rc-deploy.yml, testing-deploy.yml and release.yml build
  # it — and no pull request built it before this job. All four rc-deploy
  # failures from Sep 29 to Nov 10 (runs 40563851333, 40575819538, 40582570895,
  # 40766476117), and the Oct 28 nightly (40665787128), were one break: the ui
  # build inside the image could not resolve cli/src/cmd/app/skeleton, which
  # .dockerignore left out of the context. Every one surfaced after the merge,
  # 42 to 59 minutes into its run, behind the api package's release compile.
  # check-invariants.mjs (`image-build-input-ignored`) now reads the imports for
  # that one shape; this job is the build itself, for every shape.
  #
  # WHAT IT PROVES, AND WHAT IT DOES NOT. The api is not compiled here or in any
  # app image: main's published api package (ghcr.io/…/talaria-api:main,
  # public) is only a file the runtime stage copies. So this proves the UI,
  # mcp, omp-auth, CLI-skeleton and runtime-copy halves of the context — the
  # half that broke — and nothing about this commit's api, which the api job
  # and rc-deploy's own package build cover. No login and no push: the image is
  # thrown away (the header's DELIBERATELY LEFT OUT), and the job needs nothing
  # but a read of the tree.
  #
  # Its surface (scripts/surfaces.mjs, `image`) is what the build reads, so it
  # runs in every mode but promotion, whose surfaces are all off.
  image:
    name: app image builds (docker)
    needs: [changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # amd64, as every published app image is. VERSION names the commit in
      # the image's label and TALARIA_VERSION; REVISION and CREATED keep the
      # Dockerfile's "unknown" defaults, which is true of an image nobody
      # ships.
      - name: Build the app image (no push)
        run: |
          set -eu
          docker build --platform linux/amd64 \
            --build-arg TALARIA_API_IMAGE=ghcr.io/outcrop-labs/talaria-api:main \
            --build-arg "VERSION=ci-$(git rev-parse --short=12 HEAD)" \
            -t talaria-ci:check .

  # The desktop shell (docs/DESKTOP.md) — the same tripwire treatment for
  # desktop/ that the jobs above give ui/, mcp/, cli/ and api/: fmt + clippy +
  # tests for src-tauri, svelte-check for the launcher (`bun run
  # desktop:check` from the root runs the same list). Unlike api/, this job
  # DOES need an apt step: tauri's webkit/gtk sys crates run pkg-config even
  # under `cargo check`, so a bare runner dies before compiling a line of
  # ours. No bundle step — installers are a release-time concern and now have a
  # home of their own (desktop-package.yml, built on every platform and pinned
  # to a release); dragging linuxdeploy and the flatpak runtime into a tripwire
  # would make it slow enough to be skipped.
  #
  # THE CONNECT SMOKE closes each of the three desktop jobs: does the shell open
  # an instance at all? On Windows every first open froze the app for good (a
  # webview created inside a WebView2 IPC callback deadlocks), and nothing could
  # see it: clippy and the tests cannot see a hang, and desktop-package.yml's
  # installer smoke asks only whether the process is still up after 20 s, which
  # a frozen one is. Each job builds the real shell (debug, launcher embedded),
  # registers a fake instance on localhost as the last view, launches it, and
  # passes only if the instance page is requested and its script runs — boot,
  # probe, activate, webview, navigation. desktop/packaging/connect-smoke.mjs is
  # the script; it says which step happened last when it fails. The wait is 90 s
  # because a pass exits the moment the page answers, while release.yml runs
  # this file before every publish: a slow WebView2 cold start must not block a
  # release. The smoke steps share their job's build and its one rust-cache key
  # (the Actions cache is close to its 10 GB cap), and run even after a clippy
  # or test failure, so a red job still says whether the app opens.
  desktop:
    name: fmt + clippy + test + typecheck (desktop)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # Rust (+ rustfmt/clippy) and Bun + Node, then the frozen desktop install —
      # desktop/src-tauri/rust-toolchain.toml pins the same toolchain and
      # devboxes install the same one.
      - uses: ./.github/actions/setup-runtime
        with:
          install-dir: desktop

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # A push to main writes it; every other run restores (the api
          # job's cache note says why).
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Needed even for `cargo check`/clippy — the sys crates probe the
      # webkit2gtk/gtk packages at build-script time. ubuntu-latest (24.04)
      # ships libwebkit2gtk-4.1-dev; if a runner-image bump ever removes it,
      # this is the line to read. xvfb and dbus are the connect smoke's display
      # and session bus.
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth dbus

      - name: Format
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --quiet

      - name: Typecheck
        working-directory: desktop
        run: bun run typecheck

      # `custom-protocol` embeds desktop/dist, so the launcher is the built one
      # and not tauri.conf.json's devUrl (see the feature's note in Cargo.toml).
      - name: Build the launcher
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: bun run build:vite

      - name: Build the shell
        if: ${{ !cancelled() }}
        working-directory: desktop/src-tauri
        run: cargo build --features custom-protocol

      # A private X display and session bus (the shell's single-instance name
      # and GApplication live on the bus); software rendering.
      - name: Connect smoke
        if: ${{ !cancelled() }}
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a dbus-run-session -- node desktop/packaging/connect-smoke.mjs desktop/src-tauri/target/debug/talaria-desktop --wait 90

  # The same crate on macOS. The shell's macOS code — the
  # UNUserNotificationCenter backend and its delegate (notify/macos.rs), the
  # dock badge, the menu-bar item, `RunEvent::Reopen` — is behind
  # `cfg(target_os = "macos")`, so the Linux job above never compiles a line
  # of it, and desktop-package.yml only builds on main and by dispatch. This
  # job is what puts it through clippy and the tests on every full-mode
  # desktop run, and the connect smoke through WKWebView (the runner has a GUI
  # session). No bundle and no apt step: macOS has the webview already.
  #
  # FULL MODE ONLY, like the Windows, iOS and e2e jobs: a pull request into rc
  # or main, a push to rc or main, a release, or ci/full/<branch>. A light or
  # integration run skips the platform legs (the header's MODES); the rc
  # pull request is where they gate.
  desktop-macos:
    name: clippy + test + connect smoke (desktop macos)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.mode != 'light' && needs.changes.outputs.mode != 'integration'
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          install-dir: desktop

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # A push to main writes it; every other run restores (the api
          # job's cache note says why).
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --quiet

      - name: Build the launcher
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: bun run build:vite

      - name: Build the shell
        if: ${{ !cancelled() }}
        working-directory: desktop/src-tauri
        run: cargo build --features custom-protocol

      - name: Connect smoke
        if: ${{ !cancelled() }}
        run: node desktop/packaging/connect-smoke.mjs desktop/src-tauri/target/debug/talaria-desktop --wait 90

  # The same crate on Windows, for the same reason as macOS: notify/windows.rs
  # and every `cfg(windows)` branch are compiled by no other job, and the tests
  # carry Windows semantics of their own (paths, the registry's tmp + rename
  # write, the beacon tests over local sockets). No apt step: the WebView2
  # bindings ship inside webview2-com-sys. The connect smoke here is the one
  # that caught the freeze: it failed on rc's code and passes with the fix.
  #
  # Full mode only, like desktop-macos (see its note).
  desktop-windows:
    name: clippy + test + connect smoke (desktop windows)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.mode != 'light' && needs.changes.outputs.mode != 'integration'
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-runtime
        with:
          install-dir: desktop

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # A push to main writes it; every other run restores (the api
          # job's cache note says why).
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --quiet

      - name: Build the launcher
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: bun run build:vite

      - name: Build the shell
        if: ${{ !cancelled() }}
        working-directory: desktop/src-tauri
        run: cargo build --features custom-protocol

      - name: Connect smoke
        if: ${{ !cancelled() }}
        run: node desktop/packaging/connect-smoke.mjs desktop/src-tauri/target/debug/talaria-desktop.exe --wait 90

  # The surface gate, on Linux: what `bun run mobile:check` runs, and what a
  # devbox runs. `--no-daemon` because a CI runner is thrown away afterwards and
  # a lingering daemon only costs it memory.
  mobile:
    name: test + assemble (mobile)
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # JDK 21: AGP and Gradle both fully support it, and newer JDKs lead AGP
      # by months. mobile/tools/devbox-install.sh installs the same major.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK; this adds only what the project
      # pins. API 37 exists ONLY as a dotted minor (37.0/.1/.2) — there is no
      # plain `android-37` — and AndroidX Compose 1.12 refuses to compile
      # against anything below 37, failing in checkDebugAarMetadata a long way
      # from the cause. The provisioner knows the same thing.
      - name: Android platform the project pins
        run: |
          set -eu
          sdkmanager=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          [ -x "$sdkmanager" ] || { echo "no sdkmanager on this runner" >&2; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install 'platforms;android-37.2' 'build-tools;37.0.0' >/dev/null

      # The shared module's tests INCLUDE the headless UI ones: runComposeUiTest
      # composes the real tree against Skia's software renderer, so there is no
      # emulator and no display here. iOS is the next job's business — Kotlin/
      # Native cannot build Apple targets off macOS.
      - name: Test (shared, including the headless UI suite)
        working-directory: mobile
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Assemble (android)
        working-directory: mobile
        run: ./gradlew :androidApp:assembleDebug --no-daemon

  # THE APPLE LEG, and the only place it exists. Kotlin/Native needs Xcode's
  # linker, so `iosArm64` and `iosSimulatorArm64` are declared on every host and
  # buildable on exactly one — `kotlin.native.ignoreDisabledTargets` is what
  # lets a Linux box configure this build rather than fail it. Until this job
  # runs, those targets have never been compiled at all.
  #
  # BLOCKING, as of the run that first proved it works: both targets compiled
  # and `linkDebugFrameworkIosSimulatorArm64` succeeded on PR #540. It was
  # briefly `continue-on-error` for the honest reason that a job which had never
  # been green must not gate the Android work being tested on real devices — and
  # that reason expired the moment it went green.
  #
  # It has to be blocking rather than advisory, because this is the ONLY place
  # the Apple targets are ever built: nobody compiles them locally (Kotlin/
  # Native needs Xcode), so an advisory cross here means commonMain quietly
  # stops being multiplatform and nobody finds out until somebody wants an iOS
  # build. LINKING is checked for the same reason — a klib can compile and still
  # fail to link, and linking is what an `iosApp/` project will depend on.
  #
  # Full mode only, like desktop-macos (see its note).
  mobile-ios:
    name: compile + link (mobile ios)
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.mode != 'light' && needs.changes.outputs.mode != 'integration'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Needed even though nothing Android is built here: `:shared` declares an
      # android target, so Gradle must be able to CONFIGURE it before it will
      # compile anything at all.
      - name: Android platform (to configure :shared)
        run: |
          set -eu
          sdkmanager=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          [ -x "$sdkmanager" ] || { echo "no sdkmanager on this runner" >&2; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install 'platforms;android-37.2' 'build-tools;37.0.0' >/dev/null

      # Device and Apple-silicon simulator. NOT iosX64: Compose Multiplatform
      # 1.12 no longer publishes an Intel-simulator variant, so declaring it
      # fails resolution for every Compose-dependent source set.
      - name: Compile the Apple targets
        working-directory: mobile
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon

      # The framework Swift will consume. Linking is a separate failure mode
      # from compiling — a klib can compile and still fail to link — and it is
      # what an iosApp/ Xcode project will depend on.
      - name: Link the shared framework
        working-directory: mobile
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon

  # THE MCP SURFACE, END TO END (docs/E2E.md). The one job in this file that
  # boots services — postgres, redis, the api, the built ui and the stub
  # world in scripts/e2e/mcp-stubs.mjs — because the thing it guards is the
  # seam between them: the catalog mirror, install-time discovery, the
  # credentials editor, the OAuth dance, an agent's MCP tab and the gateway
  # each worked alone and regressed together before (no test crossed them).
  # A tripwire still: one browser, seven chapters, no retries.
  #
  # WHY docker run AND NOT `services:`. `bun run migrations:check` pg_dumps
  # through `docker exec talaria-mig-pg`, so the container needs that NAME —
  # the same bootstrap the api job's live steps use, which doubles as the
  # schema-snapshot check.
  #
  # WHY THE STUBS ARE HTTPS. The mirror installs only https remotes, so the
  # stub mints a throwaway CA; `--init` prints the three settings the api
  # needs to reach it (TALARIA_FETCH_ALLOW_HOSTS for the SSRF guard,
  # SSL_CERT_FILE for its TLS roots, TALARIA_MCP_REGISTRY_URL for the
  # catalog) and they go into $GITHUB_ENV before the app (and the api it
  # spawns) starts. None of them is a test hook — each is an operator setting.
  #
  # Full mode only, like desktop-macos (see its note).
  e2e:
    name: mcp end-to-end (playwright)
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.mode != 'light' && needs.changes.outputs.mode != 'integration'
    runs-on: ubuntu-latest
    # A cold api build is most of it; the cache below makes reruns minutes.
    timeout-minutes: 45

    env:
      DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
      REDIS_URL: redis://127.0.0.1:6399
      # Never a real key: these containers die with the job.
      TALARIA_SECRET_KEY: ci-scratch-key
      AUTH_SECRET: ci-scratch-auth-secret
      CARGO_INCREMENTAL: '0'
      PORT: '4173'
      TALARIA_API_PORT: '5274'
      # The OAuth callback base — the origin the browser is on.
      AUTH_PUBLIC_URL: http://localhost:4173
      E2E_BASE_URL: http://localhost:4173
      E2E_STUB_PORT: '5390'
      E2E_STUB_URL: https://127.0.0.1:5390
      E2E_DATABASE_URL: postgres://talaria:talaria@127.0.0.1:55441/talaria
      E2E_REDIS_URL: redis://127.0.0.1:6399
      # The run's directories (the stub CA, the fleet tree, the results, the
      # logs) live under $RUNNER_TEMP, which job-level env cannot name — the
      # `runner` context does not exist there, and using it invalidates the
      # whole workflow. The first step writes them into $GITHUB_ENV instead.

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # Logs sit BESIDE the Playwright output, never in it: Playwright empties
      # its outputDir when the run starts, which would take the app and stub
      # logs written before it with it.
      - name: Lay out the run's directories
        run: |
          {
            echo "E2E_STUB_DIR=$RUNNER_TEMP/e2e-stub"
            # Where the api renders agent credentials, and where the gateway
            # chapter reads the hired agent's own key from.
            echo "TALARIA_FLEET_DIR=$RUNNER_TEMP/fleet"
            echo "E2E_FLEET_ENV=$RUNNER_TEMP/fleet/.env"
            echo "E2E_OUTPUT_DIR=$RUNNER_TEMP/e2e-results"
            echo "E2E_REPORT_DIR=$RUNNER_TEMP/e2e-report"
            echo "E2E_LOG_DIR=$RUNNER_TEMP/e2e-logs"
          } >> "$GITHUB_ENV"

      # A hire renders the agent from the fleet chassis, and fails without
      # one ("fleet chassis missing"). Seed the tree the way
      # `talaria worktree` does (cli/src/cmd/worktree.ts): the dirs, the
      # shipped chassis template, and a .env with the gateway-brain header
      # the first render fills in.
      - name: Seed the fleet config plane
        run: |
          set -eu
          mkdir -p "$TALARIA_FLEET_DIR/skills" "$TALARIA_FLEET_DIR/hooks" "$TALARIA_FLEET_DIR/agents"
          cp scripts/chassis.template.yml "$TALARIA_FLEET_DIR/chassis.yml"
          ( umask 077; printf 'LLM_BASE_URL=\nLLM_API_KEY=\nLLM_MODEL=\n' > "$TALARIA_FLEET_DIR/.env" )

      # Everything: Rust for the api, bun + node for the ui build, the stub
      # and Playwright; the frozen ui install carries @playwright/test.
      - uses: ./.github/actions/setup-runtime
        with:
          install-dir: ui

      # The api job's cache, read-only: the debug build here shares its
      # dependency tree, and one writer keeps the cache what the api job made.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          shared-key: api
          save-if: false

      - uses: ./.github/actions/mold

      - name: Start scratch postgres 16 and redis 7
        run: |
          docker run -d --name talaria-mig-pg \
            -e POSTGRES_USER=talaria -e POSTGRES_PASSWORD=talaria -e POSTGRES_DB=talaria \
            -p 127.0.0.1:55441:5432 postgres:16-alpine
          docker run -d --name talaria-ci-redis -p 127.0.0.1:6399:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec talaria-mig-pg pg_isready -h 127.0.0.1 -U talaria -q && echo "postgres ready" && exit 0
            sleep 1
          done
          echo "postgres never became ready"; docker logs talaria-mig-pg; exit 1

      - name: Bootstrap schema (full migration replay + snapshot check)
        working-directory: ui
        run: bun run migrations:check

      - name: Build the api
        working-directory: api
        run: cargo build --quiet --bin talaria-api

      - name: Build the ui
        working-directory: ui
        run: bun run build

      - name: Start the stubs
        run: |
          set -eu
          mkdir -p "$E2E_STUB_DIR" "$E2E_LOG_DIR"
          node scripts/e2e/mcp-stubs.mjs --init | tee -a "$GITHUB_ENV"
          nohup node scripts/e2e/mcp-stubs.mjs > "$E2E_LOG_DIR/stubs.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -sf --cacert "$E2E_STUB_DIR/ca.pem" "$E2E_STUB_URL/_e2e/health" && echo && exit 0
            sleep 1
          done
          echo "the stubs never answered"; cat "$E2E_LOG_DIR/stubs.log"; exit 1

      # `bun run start` runs the migrations pass, then spawns the api binary
      # with its own env — the stub settings above included — and proxies
      # /api/* to it: the same process shape a deployed instance has.
      - name: Start the app (ui + api)
        working-directory: ui
        env:
          TALARIA_API_BIN: ${{ github.workspace }}/api/target/debug/talaria-api
        run: |
          set -eu
          nohup bun run start > "$E2E_LOG_DIR/app.log" 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/api/healthz" || true)
            [ "$code" = 200 ] && echo "app healthy" && exit 0
            sleep 2
          done
          echo "the app never became healthy (last: $code)"; tail -100 "$E2E_LOG_DIR/app.log"; exit 1

      - name: Install chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Typecheck the suite
        working-directory: ui
        run: bun run typecheck:e2e

      - name: Run the suite
        working-directory: ui
        run: bun run test:e2e

      - name: Logs on failure
        if: failure()
        run: |
          echo "== app (ui + api) =="; tail -200 "$E2E_LOG_DIR/app.log" || true
          echo "== stubs =="; tail -50 "$E2E_LOG_DIR/stubs.log" || true

      # Traces, screenshots, the html report and both logs — everything a red
      # run needs to be read without re-running it.
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e-results
            ${{ runner.temp }}/e2e-report
            ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: ignore
