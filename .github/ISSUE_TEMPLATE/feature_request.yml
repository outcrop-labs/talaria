name: Feature request
description: A problem Talaria does not solve yet.
body:
  - type: markdown
    attributes:
      value: |
        Start from the problem, not a design. Say what you are trying to do and where
        Talaria stops short; the shape of the implementation is what the discussion is for.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where Talaria stops short of it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What it should do instead — concrete enough to be argued with.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you weighed, and the workarounds you use today.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The surface the proposal touches most.
      options:
        - chat
        - boards
        - knowledge
        - plans
        - research
        - files
        - agents/fleet
        - MCP
        - SDK/apps
        - desktop
        - CLI
        - api
        - other
    validations:
      required: true